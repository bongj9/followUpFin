# 로컬 개발용 DB. 실행: docker compose up -d
# ponytail: 체결 저장을 빼서 TimescaleDB는 안 쓰지만, 기존 볼륨이 이 이미지 설정에 묶여 있어 그대로 둔다
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: followupfin
      POSTGRES_USER: followupfin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-followupfin} # 로컬 전용 기본값. 서버에서는 환경변수로
    ports:
      - "127.0.0.1:5432:5432" # 이 맥에서만 접속
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
