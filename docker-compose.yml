# 로컬 개발용 DB. PostgreSQL + TimescaleDB(시계열 확장). 실행: docker compose up -d
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: followupfin
      POSTGRES_USER: followupfin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-followupfin} # 로컬 전용 기본값. 서버에서는 환경변수로
    ports:
      - "127.0.0.1:5432:5432" # 이 맥에서만 접속
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # DB를 처음 만들 때 한 번만 실행
    restart: unless-stopped

volumes:
  pgdata:
