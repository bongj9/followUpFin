spring:
  application:
    name: followUpFin
  config:
    # API 키는 git에 올리지 않는 secret.yml에 둔다 (예시: secret.example.yml)
    import: optional:file:./secret.yml
  datasource:
    # docker compose up -d 로 띄운 PostgreSQL (docker-compose.yml)
    url: jdbc:postgresql://localhost:5432/followupfin
    username: followupfin
    password: ${DB_PASSWORD:followupfin} # 로컬 docker 전용 기본값
  jpa:
    hibernate:
      ddl-auto: update
  task:
    scheduling:
      pool:
        size: 4 # 10분짜리 뉴스 수집이 웹소켓 PING을 막지 않도록
  web:
    error:
      include-message: always # 화면에 "없는 티커" 같은 이유를 보여주려고
    resources:
      cache:
        cachecontrol:
          no-cache: true # 화면을 고치면 새로고침만으로 바로 반영되게 (브라우저가 옛 index.html을 재사용하지 않도록)

briefing:
  poll-interval: PT10M
  big-move-percent: 5 # 전일 대비 이 이상 오르거나 내리면 강조
