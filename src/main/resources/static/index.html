<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 브리핑</title>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; --news: #0f766e; --disc: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  #updated { color: var(--muted); font-size: 13px; }
  /* 두 페이지. 홈: 관심종목 | 뉴스·공시 / 종목(main.page-stock): 헤더, 차트 | 이 종목 뉴스·공시, 아래 투자자·호가·체결 */
  main { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-areas: "watch feed"; gap: 16px; padding: 16px 20px; max-width: 1440px; margin: 0 auto; align-items: start; }
  #watch { grid-area: watch; } #feedBox { grid-area: feed; } #head { grid-area: head; } #chartSection { grid-area: chart; } #below { grid-area: below; }
  #head, #chartSection, #below { display: none; }
  main.page-stock { grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "head head" "chart feed" "below feed"; }
  main.page-stock #watch { display: none; }
  main.page-stock #head { display: flex; } main.page-stock #chartSection { display: block; } main.page-stock #below { display: grid; }
  main.page-stock #feedBox { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; } /* 차트를 내려 봐도 뉴스는 옆에 남는다 */
  #below { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { main.page-stock { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "chart" "feed" "below"; } main.page-stock #feedBox { position: static; max-height: none; } }
  @media (max-width: 720px) { main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "watch" "feed"; padding: 12px 16px; } header { padding: 12px 16px; gap: 8px; } #updated { display: none; } }
  .up { color: #dc2626; } .down { color: #2563eb; }
  #head { align-items: center; gap: 12px; padding: 0 4px; }
  #head .back { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: var(--text); }
  #head .back:hover { background: var(--bg); }
  h1 { cursor: pointer; }
  #head .name { display: flex; gap: 8px; align-items: baseline; }
  #head .name b { font-size: 17px; }
  #head .name small { color: var(--muted); font-size: 13px; }
  #head .price { display: flex; gap: 10px; align-items: baseline; }
  #head .last { font-size: 28px; font-weight: 700; color: var(--text); }
  #head .chg { font-size: 14px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 4px; }
  .tabs button { border: 0; background: none; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.active { color: var(--text); font-weight: 700; border-bottom-color: var(--text); }
  #below h2, #feedBox > h2 { margin-top: 0; }
  .lvl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 28px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .lvl.ask { background: #f5f8ff; } .lvl.bid { background: #fff6f6; }
  .lvl .vol { padding: 0 8px; height: 100%; display: flex; align-items: center; }
  /* 잔량 막대: 매도는 가운데(가격)쪽에서 왼쪽으로, 매수는 오른쪽으로 자란다 */
  .lvl.ask .vol { justify-content: flex-end; background: linear-gradient(to left, rgba(37,99,235,0.15) var(--w), transparent var(--w)); }
  .lvl.bid .vol { background: linear-gradient(to right, rgba(220,38,38,0.15) var(--w), transparent var(--w)); }
  .lvl .px { display: flex; flex-direction: column; align-items: center; min-width: 84px; line-height: 1.15; padding: 1px 6px; border-radius: 4px; }
  .lvl .px small { font-size: 10px; opacity: 0.8; }
  .lvl.now .px { box-shadow: inset 0 0 0 1.5px var(--text); }
  .trow { display: grid; grid-template-columns: 1fr 1fr 0.7fr; padding: 4px 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .trow span:not(:first-child) { text-align: right; }
  .trow.head { color: var(--muted); border-bottom: 1px solid var(--line); }
  #trades { max-height: 420px; overflow-y: auto; }
  /* 투자자별 순매수 (차트 아래): 날짜 | 개인 | 외국인 | 기관 */
  .irow { display: grid; grid-template-columns: 72px repeat(3, 1fr); padding: 5px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .irow span:not(:first-child) { text-align: right; }
  .irow.head { color: var(--muted); border-bottom: 1px solid var(--line); }
  .irow small, #holding { color: var(--muted); font-size: 11px; }
  #investorBox[hidden] { display: none; }
  aside, section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h2 { font-size: 14px; margin: 4px 4px 10px; color: var(--muted); }
  .stock { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .stock:hover { background: var(--bg); }
  .stock.active { background: #e8efff; color: var(--accent); font-weight: 600; }
  .stock small { color: var(--muted); font-weight: normal; margin-left: 6px; }
  .group { display: flex; justify-content: space-between; margin-top: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; }
  .group:hover { background: var(--bg); }
  .group.active { background: #e8efff; color: var(--accent); }
  .stock.indent { padding-left: 18px; }
  .quote { margin-left: auto; margin-right: 6px; text-align: right; font-size: 12px; line-height: 1.3; white-space: nowrap; }
  .quote.big .rate { font-weight: 700; padding: 0 4px; border-radius: 4px; background: #fef3c7; }
  .stock button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  input { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; min-width: 0; }
  form button { padding: 7px 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  #error { color: #dc2626; font-size: 12px; margin: 6px 4px 0; }
  .item { padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; color: #fff; }
  .badge.NEWS { background: var(--news); }
  .badge.DISCLOSURE { background: var(--disc); }
  .badge.MOVE { background: #dc2626; }
  .badge.MARKET { background: #4f46e5; }
  .item.MOVE { background: #fff7ed; border-radius: 8px; cursor: pointer; }
  .item.MOVE .title { font-weight: 700; margin: 4px 0; }
  .item a { display: block; color: var(--text); text-decoration: none; font-weight: 600; margin: 4px 0; }
  .item a:hover { color: var(--accent); }
  .item p { margin: 0; font-size: 13px; color: var(--muted); }
  #chartBox { padding: 0; }
  #chartBox[hidden] { display: none; }
  #chartBox:fullscreen { background: var(--card); padding: 16px; display: flex; flex-direction: column; }
  #chartBox:fullscreen #chartWrap { flex: 1; height: auto !important; }
  #toolbar { position: relative; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  #toolbar .group { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-start; margin: 0; padding: 0; } /* 관심종목 .group 스타일이 섞이지 않게 */
  #toolbar button, #toolbar select { border: 0; background: none; border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; }
  #toolbar button:hover, #toolbar select:hover { background: var(--bg); }
  #toolbar .active { background: #eef0f3; font-weight: 700; }
  #toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  #toolbar .menu { position: absolute; right: 0; top: 100%; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); display: grid; gap: 8px; font-size: 13px; min-width: 180px; }
  #toolbar .menu label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #chartWrap { position: relative; height: 420px; }
  #chart { height: 100%; }
  #legend { position: absolute; top: 4px; left: 6px; z-index: 3; pointer-events: none; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  #legend .row { display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 4px; width: fit-content; }
  #legend .row button { pointer-events: auto; border: 0; background: #f1f3f5; border-radius: 4px; width: 18px; height: 18px; font-size: 11px; line-height: 18px; cursor: pointer; color: var(--muted); padding: 0; }
  #legend .row.off span { opacity: 0.35; }
  #measure { position: absolute; z-index: 4; font-size: 12px; font-weight: 700; background: #fff; border: 1px solid currentColor; border-radius: 6px; padding: 2px 6px; pointer-events: none; white-space: nowrap; }
  #measure[hidden] { display: none; }
  #live { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<header><h1>종목 브리핑</h1><span><span id="live">실시간 연결 중…</span> · <span id="updated"></span></span></header>
<main id="main">
  <aside id="watch">
    <h2>관심 종목</h2>
    <div id="stocks"></div>
    <form id="follow">
      <input name="stockCode" placeholder="티커 (NVDA)" maxlength="7" required>
      <input name="name" placeholder="이름 (선택)">
      <button>추가</button>
    </form>
    <div id="error"></div>
  </aside>
  <div id="head"></div>
  <section id="chartSection">
    <div id="chartBox" hidden><div id="toolbar"></div><div id="chartWrap"><div id="legend"></div><div id="measure" hidden></div><div id="chart"></div></div></div>
  </section>
  <div id="below">
    <section id="investorBox" hidden><h2>투자자별 순매수 <span id="holding"></span></h2><div id="investors"></div></section>
    <section><h2>호가</h2><div id="book"></div></section>
    <section><h2>체결</h2><div id="trades"></div></section>
  </div>
  <section id="feedBox">
    <h2 id="feedTitle">전체 뉴스·공시</h2>
    <div class="tabs" id="tabs"></div>
    <div id="feed"></div>
  </section>
</main>
<script>
  // selected: null(전체) | { stockCode, label } | { industry, label }
  let selected = null;
  const LABEL = { NEWS: '뉴스', DISCLOSURE: '공시', MOVE: '변동', MARKET: '시장' };
  const NO_INDUSTRY = '분류 없음';

  // 외부 데이터(기사 제목 등)는 innerHTML 대신 textContent로만 넣는다
  function el(tag, props = {}, ...children) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...children);
    return e;
  }

  // 한국식 표기: 상승 빨강, 하락 파랑. 큰 변동은 노란 배경
  const num = (v, currency) => currency === 'USD'
    ? Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : Number(v).toLocaleString('ko-KR');
  const priceText = q => q.currency === 'USD' ? '$' + num(q.lastPrice, 'USD') : num(q.lastPrice) + '원';
  const dirClass = rate => rate > 0 ? 'up' : rate < 0 ? 'down' : '';
  function changeText(q) {
    const rate = q.changeRate;
    if (rate == null) return '';
    const sign = rate > 0 ? '+' : '';
    return sign + num(q.change, q.currency) + ' (' + sign + rate.toFixed(2) + '%)';
  }
  function quoteBox(q) {
    if (!q) return el('span');
    return el('div', { className: 'quote' + (q.bigMove ? ' big' : ''), title: '전일 종가 ' + (q.prevClose ?? '-') },
      el('div', { textContent: priceText(q) }),
      el('div', { className: 'rate ' + dirClass(q.changeRate), textContent: changeText(q) }));
  }

  function withCode(box, code) { box.dataset.code = code; return box; }

  // 차트 (토스 시세, TradingView 오픈소스 Lightweight Charts). 토스증권 차트처럼 툴바·보조지표·그리기·자·종목비교
  // 상승 빨강·하락 파랑. 차트 라이브러리는 UTC로 그리므로 시각은 한국 시간으로 옮겨서 넣는다 (캔들은 서버가 이미 옮겨서 줌)
  const LC = LightweightCharts;
  const KST = 9 * 3600;
  const UP = '#dc2626', DOWN = '#2563eb';
  const INTRADAY = [['tick', '틱'], ['1m', '1분'], ['5m', '5분'], ['15m', '15분'], ['30m', '30분'], ['1h', '1시간']];
  const PERIODS = [['1d', '일'], ['1w', '주'], ['1M', '월'], ['1y', '년']];
  const BUCKET = { '1m': 60, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600 };
  const COMPARE_COLORS = ['#f97316', '#10b981', '#a855f7', '#0ea5e9'];
  const MAIN_HEIGHT = 420, PANE_HEIGHT = 110;
  let stockList = [];

  // 지표 계산. 결과는 봉과 같은 길이의 배열, 계산이 안 되는 자리는 null
  const closes = bars => bars.map(b => b.close);
  function sma(vals, n) {
    let sum = 0;
    return vals.map((v, i) => { sum += v - (i >= n ? vals[i - n] : 0); return i >= n - 1 ? sum / n : null; });
  }
  function ema(vals, n) {
    const k = 2 / (n + 1);
    let e = null, seen = 0;
    return vals.map(v => { if (v == null) return null; e = e == null ? v : v * k + e * (1 - k); return ++seen >= n ? e : null; });
  }
  function bollinger(vals, n, side) {
    const mid = sma(vals, n);
    return mid.map((m, i) => {
      if (m == null) return null;
      const sd = Math.sqrt(vals.slice(i - n + 1, i + 1).reduce((s, v) => s + (v - m) ** 2, 0) / n);
      return m + side * 2 * sd;
    });
  }
  function rsi(vals, n = 14) {
    let gain = 0, loss = 0;
    return vals.map((v, i) => {
      if (i === 0) return null;
      const d = v - vals[i - 1];
      const up = Math.max(d, 0), down = Math.max(-d, 0);
      if (i <= n) { gain += up / n; loss += down / n; } else { gain = (gain * (n - 1) + up) / n; loss = (loss * (n - 1) + down) / n; }
      return i < n ? null : loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
    });
  }
  function macd(vals) {
    const fast = ema(vals, 12), slow = ema(vals, 26);
    return fast.map((f, i) => f == null || slow[i] == null ? null : f - slow[i]);
  }
  const macdSignal = vals => ema(macd(vals), 9);
  const macdHist = vals => { const m = macd(vals), s = macdSignal(vals); return m.map((v, i) => v == null || s[i] == null ? null : v - s[i]); };
  // n개 봉의 (최고가 + 최저가) / 2. 일목균형표용
  const midRange = (bars, n) => bars.map((_, i) => {
    if (i < n - 1) return null;
    const w = bars.slice(i - n + 1, i + 1);
    return (Math.max(...w.map(b => b.high)) + Math.min(...w.map(b => b.low))) / 2;
  });
  // k > 0: k봉 앞으로 밀기 (선행), k < 0: 뒤로 당기기 (후행)
  const shift = (vals, k) => vals.map((_, i) => vals[i - k] ?? null);
  const tone = (v, up) => ({ value: v, color: up ? 'rgba(220,38,38,0.4)' : 'rgba(37,99,235,0.4)' });

  // 보조지표. pane: 아래 별도 칸. lines의 label은 범례에 색깔 숫자로 표시
  const INDICATORS = [
    { key: 'ma', name: '이동평균선', lines: [[5, '#16a34a'], [20, '#dc2626'], [60, '#f59e0b'], [120, '#8b5cf6']]
        .map(([n, color]) => ({ label: n, color, calc: b => sma(closes(b), n) })) },
    { key: 'bb', name: '볼린저밴드', lines: [
      { label: '20', color: '#0ea5e9', calc: b => sma(closes(b), 20) },
      { label: '2', color: '#0ea5e9', calc: b => bollinger(closes(b), 20, 1) },
      { color: '#0ea5e9', calc: b => bollinger(closes(b), 20, -1) }] },
    { key: 'ichimoku', name: '일목균형표', lines: [
      { label: '0', color: '#f59e0b', calc: b => midRange(b, 9) },   // 전환선
      { label: '1', color: '#16a34a', calc: b => midRange(b, 26) },  // 기준선
      { label: '2', color: '#9ca3af', calc: b => shift(closes(b), -26) }, // 후행스팬
      { label: '3', color: '#dc2626', calc: b => { const t = midRange(b, 9), k = midRange(b, 26); return shift(t.map((v, i) => v == null || k[i] == null ? null : (v + k[i]) / 2), 26); } }, // 선행스팬1
      { label: '4', color: '#2563eb', calc: b => shift(midRange(b, 52), 26) }] }, // 선행스팬2
    { key: 'volume', name: '거래량', pane: true, lines: [
      { type: LC.HistogramSeries, options: { priceFormat: { type: 'volume' } }, calc: b => b.map(x => tone(x.volume, x.close >= x.open)) },
      { label: '20', color: '#f59e0b', calc: b => sma(b.map(x => x.volume), 20) }] },
    { key: 'rsi', name: 'RSI', pane: true, lines: [{ label: '14', color: '#7c3aed', calc: b => rsi(closes(b)) }] },
    { key: 'macd', name: 'MACD', pane: true, lines: [
      { type: LC.HistogramSeries, calc: b => macdHist(closes(b)).map(v => v == null ? null : tone(v, v >= 0)) },
      { label: '12', color: '#2563eb', calc: b => macd(closes(b)) },
      { label: '26 9', color: '#f97316', calc: b => macdSignal(closes(b)) }] },
  ];

  // 차트 설정은 브라우저에 기억 (없거나 막혀 있으면 기본값)
  const prefs = { interval: '1m', intraday: '1m', type: 'candle', on: ['ma', 'volume'], hidden: [] };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('chartPrefs')) ?? {}); } catch {}
  const savePrefs = () => { try { localStorage.setItem('chartPrefs', JSON.stringify(prefs)); } catch {} };

  let view = null;   // { code, interval, type, chart, main, plots, bars, compares, hover }
  let menu = null;   // 'ind' | 'compare'
  let tool = null;   // 'draw' | 'measure'
  let pending = null; // 그리기·자의 첫 번째 클릭 지점
  let compares = [];  // 비교 중인 종목 코드
  let measureSeries = null;
  const drawings = new Map(); // '종목|주기' → [[점1, 점2], ...] (새로고침하면 사라짐)

  const point = (time, v) => typeof v === 'object' ? { time, ...v } : { time, value: v };
  const toData = (bars, vals) => vals.flatMap((val, i) => val == null ? [] : [point(bars[i].time, val)]);
  const fmt = n => n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const colored = (text, color) => { const e = el('span', { textContent: text }); e.style.color = color; return e; };
  const drawKey = () => view?.code + '|' + prefs.interval;
  const btn = (text, onclick, active = false, title = '') => el('button', { textContent: text, onclick, title, className: active ? 'active' : '' });

  function renderToolbar() {
    const intraday = INTRADAY.some(([k]) => k === prefs.interval);
    const select = el('select', { className: intraday ? 'active' : '', title: '분·틱 단위', onchange: e => changeInterval(e.target.value) },
      ...INTRADAY.map(([k, label]) => el('option', { value: k, textContent: label, selected: k === prefs.intraday })));
    const left = [select, ...PERIODS.map(([k, label]) => btn(label, () => changeInterval(k), k === prefs.interval)),
      el('span', { className: 'sep' }),
      btn(prefs.type === 'candle' ? '캔들' : '라인', () => { prefs.type = prefs.type === 'candle' ? 'line' : 'candle'; savePrefs(); loadChart(true); }, false, '차트 종류 바꾸기'),
      btn('지우기', () => { drawings.delete(drawKey()); loadChart(true); }, false, '그린 선과 자 지우기')];
    const right = [
      btn('+ 보조지표', () => toggleMenu('ind'), menu === 'ind'),
      btn('그리기', () => setTool('draw'), tool === 'draw', '두 지점을 클릭해 추세선 긋기'),
      btn('자', () => setTool('measure'), tool === 'measure', '두 지점을 클릭해 등락률·봉 개수 재기'),
      btn('종목비교', () => toggleMenu('compare'), menu === 'compare' || compares.length > 0),
      btn('차트 크게보기', () => document.fullscreenElement ? document.exitFullscreen() : document.getElementById('chartBox').requestFullscreen()),
    ];
    document.getElementById('toolbar').replaceChildren(
      el('div', { className: 'group' }, ...left), el('div', { className: 'group' }, ...right), menuPanel());
  }

  function menuPanel() {
    if (menu === 'ind') {
      return el('div', { className: 'menu' }, ...INDICATORS.map(ind => el('label', {},
        el('input', { type: 'checkbox', checked: prefs.on.includes(ind.key), onchange: () => toggleIndicator(ind.key) }), ind.name)));
    }
    if (menu === 'compare') {
      const others = stockList.filter(s => s.stockCode !== selected?.stockCode);
      return el('div', { className: 'menu' }, ...(others.length
        ? others.map(s => el('label', {}, el('input', { type: 'checkbox', checked: compares.includes(s.stockCode),
            onchange: () => toggleCompare(s.stockCode) }), s.name + ' ' + s.stockCode))
        : [el('span', { textContent: '비교할 다른 팔로우 종목이 없어요' })]));
    }
    return '';
  }

  // 메뉴 밖을 누르면 닫기
  document.addEventListener('click', e => {
    // 툴바는 클릭할 때마다 다시 그려져서 눌린 요소가 이미 빠져 있을 수 있다 (isConnected)
    if (menu && e.target.isConnected && !e.target.closest('#toolbar')) { menu = null; renderToolbar(); }
  });

  function toggleMenu(m) { menu = menu === m ? null : m; renderToolbar(); }
  function setTool(t) {
    tool = tool === t ? null : t;
    pending = null;
    document.getElementById('chart').style.cursor = tool ? 'crosshair' : '';
    renderToolbar();
  }
  function changeInterval(k) {
    prefs.interval = k;
    if (INTRADAY.some(([key]) => key === k)) prefs.intraday = k;
    savePrefs();
    loadChart();
  }
  function toggleIndicator(key) {
    prefs.on = prefs.on.includes(key) ? prefs.on.filter(k => k !== key) : [...prefs.on, key];
    prefs.hidden = prefs.hidden.filter(k => k !== key);
    savePrefs();
    loadChart(true);
  }
  function toggleHidden(key) {
    prefs.hidden = prefs.hidden.includes(key) ? prefs.hidden.filter(k => k !== key) : [...prefs.hidden, key];
    savePrefs();
    view?.plots.filter(p => p.ind.key === key).forEach(p => p.series.applyOptions({ visible: !prefs.hidden.includes(key) }));
    renderLegend(view, view?.bars?.at(-1));
  }
  function toggleCompare(code) {
    compares = compares.includes(code) ? compares.filter(c => c !== code) : [...compares, code];
    loadChart(true);
  }

  // 범례: 시작·고가·저가·종가 + 지표마다 [보기/숨기기] [삭제] 이름 숫자
  function renderLegend(v, bar) {
    const box = document.getElementById('legend');
    if (!v?.bars || !bar) { box.replaceChildren(); return; }
    const prev = v.bars[v.bars.indexOf(bar) - 1];
    const base = prev?.close ?? bar.open;
    const dir = val => val >= base ? 'up' : 'down';
    const rate = prev ? (bar.close / prev.close - 1) * 100 : null;
    const rows = [el('div', { className: 'row' },
      ...[['시작', bar.open], ['고가', bar.high], ['저가', bar.low], ['종가', bar.close]].map(([k, val]) =>
        el('span', {}, k + ' ', el('b', { className: dir(val), textContent: fmt(val) }))),
      rate == null ? '' : el('b', { className: dir(bar.close), textContent: (rate >= 0 ? '+' : '') + rate.toFixed(2) + '%' }),
      el('span', { textContent: '거래량 ' + bar.volume.toLocaleString('en-US') }))];
    for (const ind of INDICATORS.filter(ind => v.plots.some(p => p.ind === ind))) {
      const hidden = prefs.hidden.includes(ind.key);
      rows.push(el('div', { className: 'row' + (hidden ? ' off' : '') },
        btn(hidden ? '○' : '●', () => toggleHidden(ind.key), false, hidden ? '보이기' : '숨기기'),
        btn('×', () => toggleIndicator(ind.key), false, '지표 삭제'),
        el('span', { textContent: ind.name }),
        ...ind.lines.filter(l => l.label).map(l => colored(String(l.label), l.color))));
    }
    for (const c of v.compares) {
      rows.push(el('div', { className: 'row' }, btn('×', () => toggleCompare(c.code), false, '비교 해제'), colored('비교 ' + c.code + ' (%)', c.color)));
    }
    box.replaceChildren(...rows);
  }

  async function fetchBars(code, interval) {
    const res = await fetch('/api/candles?symbol=' + encodeURIComponent(code) + '&interval=' + interval);
    if (!res.ok) return null;
    return (await res.json()).map(b => ({ time: b.time, open: +b.open, high: +b.high, low: +b.low, close: +b.close, volume: +b.volume }));
  }

  async function loadChart(force = false) {
    const code = selected?.stockCode ?? null;
    document.getElementById('chartBox').hidden = !code;
    if (code !== view?.code) { compares = []; tool = null; pending = null; menu = null; }
    if (!force && code === view?.code && prefs.interval === view?.interval) return;
    clearMeasure();
    view?.chart.remove();
    view = null;
    renderLegend(null);
    if (!code) return;
    renderToolbar();
    const interval = prefs.interval, tick = interval === 'tick';
    // 비교 중에는 % 눈금이라 가격 기준 지표(이동평균 등)는 빼고 아래 칸 지표만 남긴다
    const inds = tick ? [] : INDICATORS.filter(i => prefs.on.includes(i.key) && (i.pane || !compares.length));
    const panes = inds.filter(i => i.pane);
    document.getElementById('chartWrap').style.height = (MAIN_HEIGHT + panes.length * PANE_HEIGHT) + 'px';
    const times = [];
    const tickLabel = i => times[i - 1] ? new Date(times[i - 1]).toLocaleTimeString('ko-KR') : '';
    const chart = LC.createChart(document.getElementById('chart'), {
      autoSize: true,
      layout: { fontSize: 11, panes: { separatorColor: '#e5e7eb' } },
      grid: { vertLines: { color: '#f1f3f5' }, horzLines: { color: '#f1f3f5' } },
      crosshair: { mode: LC.CrosshairMode.Normal },
      timeScale: tick ? { tickMarkFormatter: tickLabel } : { timeVisible: !!BUCKET[interval] },
      localization: tick ? { timeFormatter: tickLabel } : {},
    });
    if (tick) {
      const main = chart.addSeries(LC.BaselineSeries, {
        topLineColor: UP, topFillColor1: 'rgba(220,38,38,0.2)', topFillColor2: 'rgba(220,38,38,0.02)',
        bottomLineColor: DOWN, bottomFillColor1: 'rgba(37,99,235,0.02)', bottomFillColor2: 'rgba(37,99,235,0.2)' });
      // 과거 틱을 받는 동안 온 실시간 틱은 모아 뒀다가 뒤에 붙인다 (먼저 그리면 순서가 뒤집힌다)
      const v = view = { code, interval, chart, main, times, plots: [], compares: [], pending: [] };
      const recent = await fetch('/api/ticks?symbol=' + encodeURIComponent(code)).then(r => r.ok ? r.json() : []).catch(() => []);
      if (view !== v) return;
      // 저장은 1초마다라 모아 둔 틱 일부는 과거 틱에도 들어 있다. 마지막 과거 틱보다 뒤의 것만 붙인다
      // ponytail: 같은 시각(ms)의 체결이 여러 건이면 그 시각의 실시간 틱은 버려진다
      const last = recent.length ? Date.parse(recent.at(-1).timestamp) : -Infinity;
      const live = v.pending.filter(q => Date.parse(q.timestamp) > last);
      v.pending = null;
      [...recent, ...live].forEach(onTradeChart);
      return;
    }
    const type = prefs.type;
    const main = type === 'candle'
      ? chart.addSeries(LC.CandlestickSeries, { upColor: UP, downColor: DOWN, borderVisible: false, wickUpColor: UP, wickDownColor: DOWN })
      : chart.addSeries(LC.LineSeries, { color: '#111827', lineWidth: 2 });
    const plots = inds.flatMap(ind => {
      const paneIndex = ind.pane ? panes.indexOf(ind) + 1 : 0;
      return ind.lines.map(line => ({ ind, line, series: chart.addSeries(line.type ?? LC.LineSeries, {
        color: line.color, lineWidth: 1, ...line.options, priceLineVisible: false, lastValueVisible: !!ind.pane,
        crosshairMarkerVisible: false, visible: !prefs.hidden.includes(ind.key) }, paneIndex) }));
    });
    // 높이 비율: 메인 420 : 아래 칸 110씩 (autoSize라 픽셀 대신 비율로 준다)
    chart.panes().forEach((p, i) => p.setStretchFactor(i === 0 ? MAIN_HEIGHT : PANE_HEIGHT));
    const v = view = { code, interval, type, chart, main, plots, bars: [], compares: [], hover: false };
    chart.subscribeCrosshairMove(p => {
      v.hover = p.time != null;
      renderLegend(v, (p.time != null && v.bars.find(b => b.time === p.time)) || v.bars.at(-1));
    });
    chart.subscribeClick(p => onChartClick(v, p));
    chart.subscribeDblClick(p => onChartClick(v, p)); // 빠르게 두 번 누르면 두 번째는 더블클릭으로만 온다
    const [bars, ...others] = await Promise.all([code, ...compares].map(c => fetchBars(c, interval)));
    if (view !== v || !bars) return;
    v.bars = bars;
    main.setData(type === 'candle' ? bars : bars.map(b => ({ time: b.time, value: b.close })));
    plots.forEach(p => p.series.setData(toData(bars, p.line.calc(bars))));
    compares.forEach((c, i) => {
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      const series = chart.addSeries(LC.LineSeries, { color, lineWidth: 2, priceLineVisible: false });
      series.setData((others[i] ?? []).map(b => ({ time: b.time, value: b.close })));
      v.compares.push({ code: c, series, color, bars: others[i] ?? [] });
    });
    // 종목비교는 토스처럼 % 눈금 (각 선의 화면 첫 값 대비 등락률)
    if (compares.length) main.priceScale().applyOptions({ mode: LC.PriceScaleMode.Percentage });
    (drawings.get(drawKey()) ?? []).forEach(pts => addLine(v, pts, '#111827', LC.LineStyle.Solid));
    renderLegend(v, bars.at(-1));
  }

  // 그리기·자: 두 번 클릭. 그리기는 추세선을 남기고, 자는 두 점 사이 등락률과 봉 개수를 보여준다
  function onChartClick(v, p) {
    if (!tool || !p.point || p.time == null) return;
    const pt = { time: p.time, price: v.main.coordinateToPrice(p.point.y) };
    if (!pending) { pending = pt; return; }
    const [a, b] = [pending, pt].sort((x, y) => x.time - y.time);
    pending = null;
    if (a.time === b.time) return;
    if (tool === 'draw') {
      drawings.set(drawKey(), [...(drawings.get(drawKey()) ?? []), [a, b]]);
      addLine(v, [a, b], '#111827', LC.LineStyle.Solid);
      return;
    }
    clearMeasure();
    const change = (b.price / a.price - 1) * 100;
    // 틱 차트는 가로축이 체결 순번이라 차이가 곧 체결 수
    const count = v.bars ? v.bars.filter(x => x.time > a.time && x.time <= b.time).length : b.time - a.time;
    measureSeries = addLine(v, [a, b], change >= 0 ? UP : DOWN, LC.LineStyle.Dashed);
    const box = document.getElementById('measure');
    box.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '% (' + (change >= 0 ? '+' : '') + fmt(b.price - a.price) + ') · ' + count + '봉';
    box.className = change >= 0 ? 'up' : 'down';
    box.style.left = (p.point.x + 12) + 'px';
    box.style.top = p.point.y + 'px';
    box.hidden = false;
  }

  function addLine(v, [a, b], color, lineStyle) {
    const s = v.chart.addSeries(LC.LineSeries, { color, lineWidth: 2, lineStyle, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData([{ time: a.time, value: a.price }, { time: b.time, value: b.price }]);
    return s;
  }

  function clearMeasure() {
    if (measureSeries && view) view.chart.removeSeries(measureSeries);
    measureSeries = null;
    document.getElementById('measure').hidden = true;
  }

  // 체결 한 건을 봉 배열에 반영하고 바뀐 봉을 돌려준다 (늦게 온 체결이면 null)
  function applyTrade(bars, q, interval) {
    const last = bars.at(-1);
    if (!last) return null;
    const price = +q.lastPrice;
    const t = Math.floor(Date.parse(q.timestamp) / 1000) + KST;
    const size = BUCKET[interval];
    // 일·주·월·년봉은 토스 거래일 경계가 자정이 아니라 새 봉을 열지 않고 마지막 봉만 갱신
    const time = size ? t - t % size : last.time;
    if (time < last.time) return null;
    const qty = +(q.volume ?? 0);
    const bar = time === last.time
      ? { ...last, high: Math.max(last.high, price), low: Math.min(last.low, price), close: price, volume: last.volume + qty }
      : { time, open: price, high: price, low: price, close: price, volume: qty };
    if (time === last.time) bars[bars.length - 1] = bar; else bars.push(bar);
    return bar;
  }

  // 체결 한 건 반영: 틱은 점 추가, 캔들은 현재 봉·지표·비교선 갱신
  // ponytail: 체결마다 지표 전체를 다시 계산한다 (봉 최대 수천 개라 충분히 빠름). 느려지면 마지막 값만 증분 계산할 것
  function onTradeChart(q) {
    const v = view;
    if (!v) return;
    if (v.interval === 'tick') {
      if (q.stockCode !== v.code) return;
      if (v.pending) { v.pending.push(q); return; }
      if (!v.times.length) v.main.applyOptions({ baseValue: { type: 'price', price: +(q.prevClose ?? q.lastPrice) } });
      v.times.push(q.timestamp);
      v.main.update({ time: v.times.length, value: +q.lastPrice });
      return;
    }
    for (const c of v.compares) {
      if (c.code !== q.stockCode) continue;
      const bar = applyTrade(c.bars, q, v.interval);
      if (bar) c.series.update({ time: bar.time, value: bar.close });
    }
    if (q.stockCode !== v.code) return;
    const bar = applyTrade(v.bars, q, v.interval);
    if (!bar) return;
    v.main.update(v.type === 'candle' ? bar : { time: bar.time, value: bar.close });
    v.plots.forEach(p => { const val = p.line.calc(v.bars).at(-1); if (val != null) p.series.update(point(bar.time, val)); });
    if (!v.hover) renderLegend(v, bar);
  }

  // 종목 헤더: 이름·코드·현재가·전일 대비 (토스 종목 화면 맨 위)
  const quotes = new Map(); // 종목 → 최신 시세 (/api/quotes + 실시간 체결)
  function renderHead() {
    const head = document.getElementById('head');
    const code = selected?.stockCode;
    head.hidden = !code;
    if (!code) return;
    const s = stockList.find(x => x.stockCode === code);
    const q = quotes.get(code);
    head.replaceChildren(
      el('button', { className: 'back', textContent: '←', title: '전체 뉴스로', onclick: () => select(null) }),
      el('div', {},
        el('div', { className: 'name' }, el('b', { textContent: s?.name ?? code }),
          el('small', { textContent: code + (s?.industry ? ' · ' + s.industry : '') })),
        el('div', { className: 'price' }, el('span', { className: 'last', textContent: q ? priceText(q) : '-' }),
          el('span', { className: 'chg ' + dirClass(q?.changeRate), textContent: q ? changeText(q) : '' }))));
  }

  // 피드 탭 (토스 종목 화면 아래 탭처럼)
  const TABS = [[null, '전체'], ['NEWS', '뉴스'], ['DISCLOSURE', '공시'], ['MOVE', '급등락'], ['MARKET', '시장']];
  let feedType = null;
  function renderTabs() {
    if (selected && feedType === 'MARKET') feedType = null; // 시장 탭은 홈에만
    document.getElementById('tabs').replaceChildren(...TABS.filter(([type]) => !selected || type !== 'MARKET').map(([type, label]) =>
      el('button', { textContent: label, className: type === feedType ? 'active' : '', onclick: () => { feedType = type; renderTabs(); loadFeed(); } })));
  }

  // 오른쪽 호가·체결. 처음엔 REST로 받고 이후는 SSE(orderbook, trade)로 갱신
  const BOOK_DEPTH = 10;
  let side = { code: null, book: null, trades: [], investors: null, error: '' };
  const isKoreanCode = code => /^\d{6}$/.test(code);
  async function loadSide() {
    const code = selected?.stockCode ?? null;
    if (code === side.code) return;
    const s = side = { code, book: null, trades: [], investors: null, error: '' };
    renderSide();
    if (!code) return;
    const q = '?symbol=' + encodeURIComponent(code);
    const [book, trades, investors] = await Promise.all([
      fetch('/api/orderbook' + q).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/trades' + q).then(r => r.ok ? r.json() : null).catch(() => null),
      // 투자자별 매매동향은 국내 종목만 있다
      isKoreanCode(code) ? fetch('/api/investors' + q).then(r => r.ok ? r.json() : []).catch(() => []) : null]);
    s.investors = investors;
    if (side !== s) return; // 그사이 다른 종목을 골랐다
    if (!book && !trades) s.error = '토스 시세를 불러올 수 없어요 (secret.yml 토스 키·허용 IP 확인)';
    s.book = s.book ?? book; // 기다리는 동안 SSE로 더 최신 호가가 왔으면 그걸 쓴다
    // 기다리는 동안 SSE로 온 체결은 스냅샷에도 들어 있을 수 있어, 그보다 오래된 것만 붙인다
    const oldestLive = s.trades.at(-1)?.timestamp;
    const older = (trades ?? []).filter(t => !oldestLive || Date.parse(t.timestamp) < Date.parse(oldestLive));
    s.trades = [...s.trades, ...older].slice(0, 50);
    renderSide();
  }

  // 호가·체결은 초당 여러 번 올 수 있어 화면은 한 프레임에 한 번만 다시 그린다
  let sideFrame = 0;
  function scheduleSide() {
    if (!sideFrame) sideFrame = requestAnimationFrame(() => { sideFrame = 0; renderSide(); renderHead(); });
  }

  function renderSide() { renderBook(); renderTrades(); renderInvestors(); }

  // 하루치 순매수 수량(주). 당일 잠정치는 개인이 아직 없다 (다음 영업일 새벽 확정)
  function renderInvestors() {
    const list = side.investors;
    document.getElementById('investorBox').hidden = list === null;
    if (list === null) return;
    const box = document.getElementById('investors');
    const rate = list.find(d => d.foreignerHoldingRate != null)?.foreignerHoldingRate;
    document.getElementById('holding').textContent = rate == null ? '' : '외국인 보유 ' + (rate * 100).toFixed(2) + '%';
    if (!list.length) { box.replaceChildren(el('div', { className: 'empty', textContent: '투자자 동향을 불러올 수 없어요' })); return; }
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); // 2026-10-23
    const cell = v => v == null
      ? el('span', { textContent: '집계 중' })
      : el('span', { className: dirClass(v), textContent: (v > 0 ? '+' : '') + v.toLocaleString('en-US') });
    box.replaceChildren(
      el('div', { className: 'irow head' }, ...['날짜', '개인', '외국인', '기관'].map(t => el('span', { textContent: t }))),
      ...list.map(d => el('div', { className: 'irow' },
        el('span', {}, d.date.slice(5).replace('-', '.'), d.date === today ? el('small', { textContent: ' 잠정' }) : ''),
        cell(d.individual), cell(d.foreigner), cell(d.institution))));
  }

  function renderBook() {
    const box = document.getElementById('book');
    if (!side.book) { box.replaceChildren(el('div', { className: 'empty', textContent: side.error || '호가를 불러오는 중…' })); return; }
    const { currency } = side.book;
    const asks = (side.book.asks ?? []).slice(0, BOOK_DEPTH).reverse(); // 높은 가격이 위로
    const bids = (side.book.bids ?? []).slice(0, BOOK_DEPTH);
    const max = Math.max(1, ...[...asks, ...bids].map(l => +l.volume));
    const q = quotes.get(side.code);
    const prev = q?.prevClose == null ? null : +q.prevClose;
    const row = (l, kind) => {
      const vol = el('span', { className: 'vol', textContent: (+l.volume).toLocaleString('en-US') });
      vol.style.setProperty('--w', (+l.volume / max * 100).toFixed(1) + '%');
      const rate = prev ? (+l.price / prev - 1) * 100 : null;
      const px = el('span', { className: 'px ' + dirClass(rate) }, el('b', { textContent: num(l.price, currency) }),
        el('small', { textContent: rate == null ? '' : (rate > 0 ? '+' : '') + rate.toFixed(2) + '%' }));
      return el('div', { className: 'lvl ' + kind + (q && +l.price === +q.lastPrice ? ' now' : '') },
        kind === 'ask' ? vol : el('span'), px, kind === 'bid' ? vol : el('span'));
    };
    box.replaceChildren(...asks.map(l => row(l, 'ask')), ...bids.map(l => row(l, 'bid')));
  }

  function renderTrades() {
    const box = document.getElementById('trades');
    if (!side.trades.length) { box.replaceChildren(el('div', { className: 'empty', textContent: side.error || '아직 체결이 없어요' })); return; }
    const time = t => new Date(t).toLocaleTimeString('en-GB'); // 10:17:11
    box.replaceChildren(
      el('div', { className: 'trow head' }, el('span', { textContent: '시간' }), el('span', { textContent: '체결가' }), el('span', { textContent: '수량' })),
      ...side.trades.map((t, i) => {
        const older = side.trades[i + 1];
        return el('div', { className: 'trow' }, el('span', { textContent: time(t.timestamp) }),
          el('span', { className: older ? dirClass(t.price - older.price) : '', textContent: num(t.price, t.currency) }),
          el('span', { textContent: (+t.volume).toLocaleString('en-US') }));
      }));
  }

  function stockRow(s, q) {
    const del = el('button', { textContent: '×', title: '팔로우 해제', onclick: async ev => {
      ev.stopPropagation();
      await fetch('/api/stocks/' + encodeURIComponent(s.stockCode), { method: 'DELETE' });
      if (selected?.stockCode === s.stockCode) select(null); else refresh();
    }});
    const active = selected?.stockCode === s.stockCode ? ' active' : '';
    return el('div', { className: 'stock indent' + active, onclick: () => select({ stockCode: s.stockCode, label: s.name }) },
      el('span', {}, s.name, el('small', { textContent: s.stockCode })), withCode(quoteBox(q), s.stockCode), del);
  }

  // 업종별로 묶어서 보여준다. 업종 제목을 누르면 그 업종 전체 피드
  async function loadStocks() {
    // 시세가 실패해도 종목 목록은 보여준다
    const [stocks, latest] = await Promise.all([
      fetch('/api/stocks').then(r => r.json()),
      fetch('/api/quotes').then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    latest.forEach(q => quotes.set(q.stockCode, q));
    const quoteOf = quotes;
    stockList = stocks;
    const groups = Map.groupBy(stocks, s => s.industry ?? NO_INDUSTRY);
    const box = document.getElementById('stocks');
    box.replaceChildren(el('div', { className: 'stock' + (selected ? '' : ' active'), textContent: '전체', onclick: () => select(null) }));
    for (const [industry, list] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
      const clickable = industry !== NO_INDUSTRY;
      box.append(el('div', {
        className: 'group' + (selected?.industry === industry ? ' active' : ''),
        onclick: () => clickable && select({ industry, label: industry }),
      }, el('span', { textContent: industry }), el('span', { textContent: list.length })));
      list.forEach(s => box.append(stockRow(s, quoteOf.get(s.stockCode))));
    }
  }

  async function loadFeed() {
    const q = selected?.stockCode ? '?stockCode=' + encodeURIComponent(selected.stockCode)
      : selected?.industry ? '?industry=' + encodeURIComponent(selected.industry) : '';
    const items = (await (await fetch('/api/feed' + q)).json()).filter(i => feedType ? i.type === feedType : i.type !== 'MARKET'); // 시장 뉴스는 시장 탭에서만
    document.getElementById('feedTitle').textContent = selected?.stockCode ? '뉴스·공시' : selected ? selected.label + ' 뉴스·공시' : '전체 뉴스·공시';
    const feed = document.getElementById('feed');
    if (!items.length) {
      feed.replaceChildren(el('div', { className: 'empty', textContent: feedType ? '이 탭에 해당하는 항목이 없어요.' : '아직 모인 정보가 없습니다. 종목을 추가하거나 다음 수집(10분)을 기다려 주세요.' }));
      return;
    }
    feed.replaceChildren(...items.map(i => el('div', {
        className: 'item ' + i.type,
        // 변동 항목을 누르면 그 종목 피드(관련 뉴스)로 이동
        onclick: i.type === 'MOVE' ? () => select({ stockCode: i.stockCode, label: i.stockName }) : null,
      },
      el('div', { className: 'meta' },
        el('span', { className: 'badge ' + i.type, textContent: LABEL[i.type] }),
        el('span', { textContent: i.stockName }),
        el('span', { textContent: i.source ?? '' }),
        el('span', { textContent: new Date(i.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) })),
      i.url
        ? el('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer', textContent: i.title })
        : el('div', { className: 'title', textContent: i.title }),
      el('p', { textContent: i.summary }))));
  }

  // 주소로 화면을 정한다 (#/, #/stock/005930, #/industry/이름). 새로고침·뒤로가기·링크 공유가 된다
  function parseHash() {
    const [, kind, value] = location.hash.match(/^#\/(stock|industry)\/(.+)$/) ?? [];
    const v = value && decodeURIComponent(value);
    return kind === 'stock' ? { stockCode: v, label: v } : kind === 'industry' ? { industry: v, label: v } : null;
  }
  function select(target) {
    const hash = target?.stockCode ? '#/stock/' + encodeURIComponent(target.stockCode)
      : target?.industry ? '#/industry/' + encodeURIComponent(target.industry) : '#/';
    if (location.hash === hash) refresh(); else location.hash = hash; // 바뀌면 hashchange가 refresh
  }
  window.addEventListener('hashchange', () => { selected = parseHash(); window.scrollTo(0, 0); refresh(); });
  document.querySelector('h1').onclick = () => select(null);

  async function refresh() {
    // 종목을 골랐으면 종목 페이지, 아니면 홈. 차트를 만들기 전에 바꿔야 차트가 제 크기로 그려진다
    document.getElementById('main').classList.toggle('page-stock', !!selected?.stockCode);
    renderTabs(); // 시장 탭은 홈에서만 보인다
    await Promise.all([loadStocks(), loadFeed(), loadChart(), loadSide()]);
    renderHead();
    renderSide(); // 전일 종가가 늦게 와도 호가 등락률을 다시 계산
    document.getElementById('updated').textContent = new Date().toLocaleTimeString('ko-KR') + ' 갱신';
  }

  document.getElementById('follow').onsubmit = async ev => {
    ev.preventDefault();
    const form = ev.target;
    const button = form.querySelector('button');
    button.disabled = true; // 추가하면서 첫 뉴스까지 받아와 1~2초 걸린다
    const res = await fetch('/api/stocks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stockCode: form.stockCode.value.trim(), name: form.name.value.trim() })
    });
    button.disabled = false;
    document.getElementById('error').textContent = res.ok ? '' : ((await res.json()).message || '티커를 확인하세요');
    if (res.ok) { form.reset(); refresh(); }
  };

  // 서버가 토스 실시간 체결을 SSE로 넘겨준다. 끊기면 EventSource가 알아서 다시 붙는다
  const stream = new EventSource('/api/stream');
  stream.onopen = () => document.getElementById('live').textContent = '● 실시간';
  stream.onerror = () => document.getElementById('live').textContent = '실시간 재연결 중…';
  stream.addEventListener('trade', ev => {
    const q = JSON.parse(ev.data);
    quotes.set(q.stockCode, q);
    if (q.stockCode === side.code) {
      side.trades = [{ price: q.lastPrice, volume: q.volume, timestamp: q.timestamp, currency: q.currency }, ...side.trades].slice(0, 50);
      scheduleSide();
    }
    document.querySelectorAll('.quote').forEach(old => {
      if (old.dataset.code === q.stockCode) old.replaceWith(withCode(quoteBox(q), q.stockCode));
    });
    onTradeChart(q);
  });
  stream.addEventListener('move', () => loadFeed());
  stream.addEventListener('orderbook', ev => {
    const { stockCode, book } = JSON.parse(ev.data);
    if (stockCode !== side.code) return; // 보고 있는 종목만 그린다
    side.book = book;
    scheduleSide();
  });

  selected = parseHash();
  renderTabs();
  refresh();
  setInterval(refresh, 60_000);
</script>
</body>
</html>
