<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종목 브리핑</title>
<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280; --line: #e5e7eb; --accent: #2563eb; --news: #0f766e; --disc: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--card); display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  #updated { color: var(--muted); font-size: 13px; }
  /* 두 페이지. 홈: 관심종목 | 뉴스·공시 / 종목(main.page-stock): 헤더, 차트 | 이 종목 뉴스·공시, 아래 투자자·호가·체결 */
  main { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-areas: "watch flow" "watch view" "watch feed"; gap: 16px; padding: 16px 20px; max-width: 1440px; margin: 0 auto; align-items: start; }
  #watch { grid-area: watch; align-self: start; } #feedBox { grid-area: feed; } #flowBox { grid-area: flow; }
  main.page-stock #flowBox, main.page-stock #viewBox { display: none; }
  #viewBox { grid-area: view; font-size: 13px; }
  #viewBox[hidden] { display: none; }
  #viewBox h2 { margin: 0; } #viewBox .sub { color: var(--muted); font-size: 12px; }
  #viewBox .summary { margin: 8px 0 12px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
  #viewBox .step { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; padding: 8px 0; border-top: 1px solid #f1f3f5; }
  #viewBox .step .now { font-weight: 700; }
  #viewBox .step .read { grid-column: 2; color: var(--muted); }
  #viewBox a.cite { font-size: 11px; color: #2563eb; text-decoration: none; white-space: nowrap; margin-left: 4px; }
  #viewBox .levels { margin: 6px 0; display: flex; flex-direction: column; gap: 2px; }
  #viewBox .lv { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
  #viewBox .lv b { text-align: right; }
  #viewBox .lv.here { color: #dc2626; font-weight: 700; border-top: 1px dashed #dc2626; border-bottom: 1px dashed #dc2626; padding: 2px 0; }
  #viewBox details { margin-top: 10px; } #viewBox summary { cursor: pointer; font-weight: 600; }
  #viewBox details ul { margin: 6px 0; padding-left: 18px; }
  #viewBox .track { margin-top: 10px; color: #9a3412; background: #fff7ed; padding: 8px 10px; border-radius: 8px; }
  @media (max-width: 720px) { #viewBox .step { grid-template-columns: 1fr; } #viewBox .step .read { grid-column: 1; } }
  #flowBox .flowHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #flowBox h2 { margin: 0; }
  #flowSummary { font-size: 13px; margin: 6px 0 8px; display: flex; flex-direction: column; gap: 2px; }
  #flowSummary .why { color: var(--muted); }
  #flowChart { height: 260px; position: relative; } #head { grid-area: head; } #chartSection { grid-area: chart; } #below { grid-area: below; }
  #head, #chartSection, #below { display: none; }
  main.page-stock { grid-template-columns: minmax(0, 1fr) 380px; grid-template-areas: "head head" "chart feed" "below feed"; }
  main.page-stock #watch { display: none; }
  main.page-stock #head { display: flex; } main.page-stock #chartSection { display: block; } main.page-stock #below { display: grid; }
  main.page-stock #feedBox { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; } /* 차트를 내려 봐도 뉴스는 옆에 남는다 */
  #below { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1100px) { main.page-stock { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "chart" "feed" "below"; } main.page-stock #feedBox { position: static; max-height: none; } }
  @media (max-width: 720px) { main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "watch" "flow" "view" "feed"; padding: 12px 16px; } header { padding: 12px 16px; gap: 8px; } #updated { display: none; } }
  .up { color: #dc2626; } .down { color: #2563eb; }
  /* 상단 지표 띠: 같은 목록을 두 번 이어 붙이고 절반만큼 왼쪽으로 흘려서 끊김 없이 돈다. 마우스를 올리면 멈춘다 */
  #ticker { overflow: hidden; background: var(--card); border-bottom: 1px solid var(--line); }
  #ticker:empty { display: none; }
  #ticker .track { display: flex; width: max-content; animation: ticker 40s linear infinite; }
  #ticker:hover .track { animation-play-state: paused; }
  @keyframes ticker { to { transform: translateX(-50%); } }
  .ind { display: flex; align-items: center; gap: 8px; padding: 8px 20px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
  .ind b { font-weight: 600; }
  .ind svg { width: 60px; height: 20px; }
  @media (prefers-reduced-motion: reduce) { #ticker { overflow-x: auto; } #ticker .track { animation: none; } #ticker .track > .copy { display: none; } }
  #head { align-items: center; gap: 12px; padding: 0 4px; }
  #head .back { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: var(--text); }
  #head .back:hover { background: var(--bg); }
  h1 { cursor: pointer; }
  #head .name { display: flex; gap: 8px; align-items: baseline; }
  #head .name b { font-size: 17px; }
  #head .name small { color: var(--muted); font-size: 13px; }
  #head .price { display: flex; gap: 10px; align-items: baseline; }
  #head .last { font-size: 28px; font-weight: 700; color: var(--text); }
  #head .chg { font-size: 14px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 4px; }
  .tabs button { border: 0; background: none; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.active { color: var(--text); font-weight: 700; border-bottom-color: var(--text); }
  #below h2, #feedBox > h2 { margin-top: 0; }
  .lvl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 28px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .lvl.ask { background: #f5f8ff; } .lvl.bid { background: #fff6f6; }
  .lvl .vol { padding: 0 8px; height: 100%; display: flex; align-items: center; }
  /* 잔량 막대: 매도는 가운데(가격)쪽에서 왼쪽으로, 매수는 오른쪽으로 자란다 */
  .lvl.ask .vol { justify-content: flex-end; background: linear-gradient(to left, rgba(37,99,235,0.15) var(--w), transparent var(--w)); }
  .lvl.bid .vol { background: linear-gradient(to right, rgba(220,38,38,0.15) var(--w), transparent var(--w)); }
  .lvl .px { display: flex; flex-direction: column; align-items: center; min-width: 84px; line-height: 1.15; padding: 1px 6px; border-radius: 4px; }
  .lvl .px small { font-size: 10px; opacity: 0.8; }
  .lvl.now .px { box-shadow: inset 0 0 0 1.5px var(--text); }
  .trow { display: grid; grid-template-columns: 1fr 1fr 0.7fr; padding: 4px 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .trow span:not(:first-child) { text-align: right; }
  .trow.head { color: var(--muted); border-bottom: 1px solid var(--line); }
  #trades { max-height: 420px; overflow-y: auto; }
  /* 투자자별 순매수 (차트 아래): 날짜 | 개인 | 외국인 | 기관 */
  .irow { display: grid; grid-template-columns: 72px repeat(3, 1fr); padding: 5px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .irow span:not(:first-child) { text-align: right; }
  .irow.head { color: var(--muted); border-bottom: 1px solid var(--line); }
  .irow small, #holding { color: var(--muted); font-size: 11px; }
  #investorBox[hidden] { display: none; }
  aside, section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  h2 { font-size: 14px; margin: 4px 4px 10px; color: var(--muted); }
  .stock { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .stock:hover { background: var(--bg); }
  .stock.active { background: #e8efff; color: var(--accent); font-weight: 600; }
  .stock small { color: var(--muted); font-weight: normal; margin-left: 6px; }
  .group { display: flex; justify-content: space-between; margin-top: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; }
  .group:hover { background: var(--bg); }
  .group.active { background: #e8efff; color: var(--accent); }
  .stock.indent { padding-left: 18px; }
  .quote { margin-left: auto; margin-right: 6px; text-align: right; font-size: 12px; line-height: 1.3; white-space: nowrap; }
  .quote.big .rate { font-weight: 700; padding: 0 4px; border-radius: 4px; background: #fef3c7; }
  .stock button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
  input { padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; min-width: 0; }
  form button { padding: 7px 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  #error { color: #dc2626; font-size: 12px; margin: 6px 4px 0; }
  .item { padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; color: #fff; }
  .badge.NEWS { background: var(--news); }
  .badge.DISCLOSURE { background: var(--disc); }
  .badge.MOVE { background: #dc2626; }
  .badge.MARKET { background: #4f46e5; }
  .badge.HIGH { background: #dc2626; }
  .item .tip { margin-top: 6px; padding: 6px 10px; background: #fefce8; border-radius: 6px; color: #713f12; font-size: 13px; }
  .minor-toggle { display: flex; align-items: center; gap: 6px; padding: 8px 6px; font-size: 13px; color: var(--muted); }
  .item.MOVE { background: #fff7ed; border-radius: 8px; cursor: pointer; }
  .item.MOVE .title { font-weight: 700; margin: 4px 0; }
  .item a { display: block; color: var(--text); text-decoration: none; font-weight: 600; margin: 4px 0; }
  .item a:hover { color: var(--accent); }
  .item p { margin: 0; font-size: 13px; color: var(--muted); }
  .item p.original { margin: 2px 0 4px; font-size: 12px; }
  button.translate { margin-left: auto; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font: inherit; font-size: 12px; color: var(--text); cursor: pointer; }
  #chartBox { padding: 0; }
  #chartBox[hidden] { display: none; }
  #chartBox:fullscreen { background: var(--card); padding: 16px; display: flex; flex-direction: column; }
  #chartBox:fullscreen #chartWrap { flex: 1; height: auto !important; }
  #toolbar { position: relative; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  #toolbar .group { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-start; margin: 0; padding: 0; } /* 관심종목 .group 스타일이 섞이지 않게 */
  #toolbar button, #toolbar select { border: 0; background: none; border-radius: 6px; padding: 5px 9px; font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; }
  #toolbar button:hover, #toolbar select:hover { background: var(--bg); }
  #toolbar .active { background: #eef0f3; font-weight: 700; }
  #toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; }
  #toolbar .menu { position: absolute; right: 0; top: 100%; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); display: grid; gap: 8px; font-size: 13px; min-width: 180px; }
  #toolbar .menu label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #chartWrap { position: relative; height: 420px; }
  #chart { height: 100%; }
  #legend { position: absolute; top: 4px; left: 6px; z-index: 3; pointer-events: none; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  #legend .row { display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 4px; width: fit-content; }
  #legend .row button { pointer-events: auto; border: 0; background: #f1f3f5; border-radius: 4px; width: 18px; height: 18px; font-size: 11px; line-height: 18px; cursor: pointer; color: var(--muted); padding: 0; }
  #legend .chip.off span { opacity: 0.35; }
  #measure { position: absolute; z-index: 4; font-size: 12px; font-weight: 700; background: #fff; border: 1px solid currentColor; border-radius: 6px; padding: 2px 6px; pointer-events: none; white-space: nowrap; }
  #measure[hidden] { display: none; }
  #toolbar .menu label button { margin-left: auto; padding: 1px 7px; font-size: 12px; color: var(--muted); background: var(--bg); }
  #legend .chip { display: inline-flex; gap: 4px; align-items: center; margin-right: 6px; }
  #legend .chip .name { pointer-events: auto; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  #tip { position: absolute; z-index: 5; pointer-events: none; max-width: 280px; background: var(--card); border: 1px solid var(--line); border-top: 3px solid currentColor; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
  #tip[hidden] { display: none; }
  #tip .when { color: var(--muted); font-size: 11px; }
  #tip b { display: block; font-size: 13px; }
  #tip p { margin: 2px 0 0; color: var(--text); }
  #tip p + p { border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 4px; }
  #guide { margin: 0 14px 4px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.6; background: #fafbfc; }
  #guide[hidden] { display: none; }
  #guide .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #guide h3 { margin: 0; font-size: 15px; }
  #guide .close { border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  #guide .what { margin: 4px 0 10px; color: var(--muted); }
  #guide .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  #guide h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  #guide ul { margin: 0; padding-left: 18px; }
  #guide .sig { display: flex; gap: 8px; align-items: baseline; }
  #guide .icon { font-size: 14px; width: 16px; text-align: center; flex: none; }
  #guide .caution { margin-top: 10px; padding: 8px 10px; background: #fff7ed; border-radius: 8px; color: #9a3412; }
  #guide .recent { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  #guide .recent button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  #guide .recent button.on { border-color: #111827; font-weight: 700; }
  #guide .focus { margin-top: 8px; padding: 8px 10px; background: var(--card); border-left: 3px solid currentColor; border-radius: 4px; }
  #guide .src { margin-top: 8px; font-size: 11px; color: var(--muted); }
  #status { padding: 10px 14px; border-top: 1px solid #f1f3f5; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  #status:empty { display: none; }
  #status .why { color: var(--muted); }
  #live { font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  button.more { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
  button.more:disabled { color: var(--muted); cursor: default; }
</style>
</head>
<body>
<header><h1>종목 브리핑</h1><span><span id="live">실시간 연결 중…</span> · <span id="updated"></span></span></header>
<div id="ticker" aria-label="주요 지표"></div>
<main id="main">
  <aside id="watch">
    <h2>관심 종목</h2>
    <div id="stocks"></div>
    <form id="follow">
      <input name="stockCode" placeholder="티커 (NVDA)" maxlength="7" required>
      <input name="name" placeholder="이름 (선택)">
      <button>추가</button>
    </form>
    <button id="importHoldings" class="more">토스 보유 종목 가져오기</button>
    <div id="error"></div>
  </aside>
  <div id="head"></div>
  <section id="chartSection">
    <div id="chartBox" hidden><div id="toolbar"></div><div id="chartWrap"><div id="legend"></div><div id="measure" hidden></div><div id="tip" hidden></div><div id="chart"></div></div><div id="guide" hidden></div><div id="status"></div></div>
  </section>
  <div id="below">
    <section id="investorBox" hidden><h2>투자자별 순매수 <span id="holding"></span></h2><div id="investors"></div></section>
    <section><h2>호가</h2><div id="book"></div></section>
    <section><h2>체결</h2><div id="trades"></div></section>
  </div>
  <section id="flowBox">
    <div class="flowHead"><h2>외국인 수급</h2><div class="tabs" id="flowTabs"></div></div>
    <div id="flowSummary"></div>
    <div id="flowChart"></div>
  </section>
  <section id="viewBox" hidden></section>
  <section id="feedBox">
    <h2 id="feedTitle">전체 뉴스·공시</h2>
    <div class="tabs" id="tabs"></div>
    <div id="feed"></div>
  </section>
</main>
<script>
  // selected: null(전체) | { stockCode, label } | { industry, label }
  let selected = null;
  const LABEL = { NEWS: '뉴스', DISCLOSURE: '공시', MOVE: '변동', MARKET: '시장' };
  const NO_INDUSTRY = '분류 없음';

  // 외부 데이터(기사 제목 등)는 innerHTML 대신 textContent로만 넣는다
  function el(tag, props = {}, ...children) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...children);
    return e;
  }

  // 한국식 표기: 상승 빨강, 하락 파랑. 큰 변동은 노란 배경
  const num = (v, currency) => currency === 'USD'
    ? Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : Number(v).toLocaleString('ko-KR');
  const priceText = q => q.currency === 'USD' ? '$' + num(q.lastPrice, 'USD') : num(q.lastPrice) + '원';
  const dirClass = rate => rate > 0 ? 'up' : rate < 0 ? 'down' : '';
  function changeText(q) {
    const rate = q.changeRate;
    if (rate == null) return '';
    const sign = rate > 0 ? '+' : '';
    return sign + num(q.change, q.currency) + ' (' + sign + rate.toFixed(2) + '%)';
  }
  function quoteBox(q) {
    if (!q) return el('span');
    return el('div', { className: 'quote' + (q.bigMove ? ' big' : ''), title: '전일 종가 ' + (q.prevClose ?? '-') },
      el('div', { textContent: priceText(q) }),
      el('div', { className: 'rate ' + dirClass(q.changeRate), textContent: changeText(q) }));
  }

  function withCode(box, code) { box.dataset.code = code; return box; }

  // 차트 (토스 시세, TradingView 오픈소스 Lightweight Charts). 토스증권 차트처럼 툴바·보조지표·그리기·자·종목비교
  // 상승 빨강·하락 파랑. 차트 라이브러리는 UTC로 그리므로 시각은 한국 시간으로 옮겨서 넣는다 (캔들은 서버가 이미 옮겨서 줌)
  const LC = LightweightCharts;
  const KST = 9 * 3600;
  const UP = '#dc2626', DOWN = '#2563eb';
  const INTRADAY = [['tick', '틱'], ['1m', '1분'], ['5m', '5분'], ['15m', '15분'], ['30m', '30분'], ['1h', '1시간']];
  const PERIODS = [['1d', '일'], ['1w', '주'], ['1M', '월'], ['1y', '년']];
  const BUCKET = { '1m': 60, '5m': 300, '15m': 900, '30m': 1800, '1h': 3600 };
  const COMPARE_COLORS = ['#f97316', '#10b981', '#a855f7', '#0ea5e9'];
  const MAIN_HEIGHT = 420, PANE_HEIGHT = 110;
  let stockList = [];

  // 지표 계산. 결과는 봉과 같은 길이의 배열, 계산이 안 되는 자리는 null
  const closes = bars => bars.map(b => b.close);
  function sma(vals, n) {
    let sum = 0;
    return vals.map((v, i) => { sum += v - (i >= n ? vals[i - n] : 0); return i >= n - 1 ? sum / n : null; });
  }
  function ema(vals, n) {
    const k = 2 / (n + 1);
    let e = null, seen = 0;
    return vals.map(v => { if (v == null) return null; e = e == null ? v : v * k + e * (1 - k); return ++seen >= n ? e : null; });
  }
  function bollinger(vals, n, side) {
    const mid = sma(vals, n);
    return mid.map((m, i) => {
      if (m == null) return null;
      const sd = Math.sqrt(vals.slice(i - n + 1, i + 1).reduce((s, v) => s + (v - m) ** 2, 0) / n);
      return m + side * 2 * sd;
    });
  }
  function rsi(vals, n = 14) {
    let gain = 0, loss = 0;
    return vals.map((v, i) => {
      if (i === 0) return null;
      const d = v - vals[i - 1];
      const up = Math.max(d, 0), down = Math.max(-d, 0);
      if (i <= n) { gain += up / n; loss += down / n; } else { gain = (gain * (n - 1) + up) / n; loss = (loss * (n - 1) + down) / n; }
      return i < n ? null : loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
    });
  }
  function macd(vals) {
    const fast = ema(vals, 12), slow = ema(vals, 26);
    return fast.map((f, i) => f == null || slow[i] == null ? null : f - slow[i]);
  }
  const macdSignal = vals => ema(macd(vals), 9);
  const macdHist = vals => { const m = macd(vals), s = macdSignal(vals); return m.map((v, i) => v == null || s[i] == null ? null : v - s[i]); };
  // n개 봉의 (최고가 + 최저가) / 2. 일목균형표용
  const midRange = (bars, n) => bars.map((_, i) => {
    if (i < n - 1) return null;
    const w = bars.slice(i - n + 1, i + 1);
    return (Math.max(...w.map(b => b.high)) + Math.min(...w.map(b => b.low))) / 2;
  });
  // k > 0: k봉 앞으로 밀기 (선행), k < 0: 뒤로 당기기 (후행)
  const shift = (vals, k) => vals.map((_, i) => vals[i - k] ?? null);
  const tone = (v, up) => ({ value: v, color: up ? 'rgba(220,38,38,0.4)' : 'rgba(37,99,235,0.4)' });

  // 보조지표. pane: 아래 별도 칸. lines의 label은 범례에 색깔 숫자로 표시
  const INDICATORS = [
    { key: 'ma', name: '이동평균선', lines: [[5, '#16a34a'], [20, '#dc2626'], [60, '#f59e0b'], [120, '#8b5cf6']]
        .map(([n, color]) => ({ label: n, color, calc: b => sma(closes(b), n) })) },
    { key: 'bb', name: '볼린저밴드', lines: [
      { label: '20', color: '#0ea5e9', calc: b => sma(closes(b), 20) },
      { label: '2', color: '#0ea5e9', calc: b => bollinger(closes(b), 20, 1) },
      { color: '#0ea5e9', calc: b => bollinger(closes(b), 20, -1) }] },
    { key: 'ichimoku', name: '일목균형표', lines: [
      { label: '0', color: '#f59e0b', calc: b => midRange(b, 9) },   // 전환선
      { label: '1', color: '#16a34a', calc: b => midRange(b, 26) },  // 기준선
      { label: '2', color: '#9ca3af', calc: b => shift(closes(b), -26) }, // 후행스팬
      { label: '3', color: '#dc2626', calc: b => { const t = midRange(b, 9), k = midRange(b, 26); return shift(t.map((v, i) => v == null || k[i] == null ? null : (v + k[i]) / 2), 26); } }, // 선행스팬1
      { label: '4', color: '#2563eb', calc: b => shift(midRange(b, 52), 26) }] }, // 선행스팬2
    { key: 'volume', name: '거래량', pane: true, lines: [
      { type: LC.HistogramSeries, options: { priceFormat: { type: 'volume' } }, calc: b => b.map(x => tone(x.volume, x.close >= x.open)) },
      { label: '20', color: '#f59e0b', calc: b => sma(b.map(x => x.volume), 20) }] },
    { key: 'rsi', name: 'RSI', pane: true, lines: [{ label: '14', color: '#7c3aed', calc: b => rsi(closes(b)) }] },
    { key: 'macd', name: 'MACD', pane: true, lines: [
      { type: LC.HistogramSeries, calc: b => macdHist(closes(b)).map(v => v == null ? null : tone(v, v >= 0)) },
      { label: '12', color: '#2563eb', calc: b => macd(closes(b)) },
      { label: '26 9', color: '#f97316', calc: b => macdSignal(closes(b)) }] },
  ];

  // 판단 재료: 지표에서 눈여겨볼 순간을 찾아 봉 위에 표시한다. 사라·팔아라가 아니라 '이런 일이 있었다'만 알린다
  // 켜 둔 지표만 본다. 결과는 { key(지표), time, position, shape, color, text(짧은 이름), note(설명) }
  const ICON = { arrowUp: '▲', arrowDown: '▼', circle: '●', square: '■' };
  const PURPLE = '#8b5cf6', AMBER = '#f59e0b';
  function signals(bars, on) {
    const c = closes(bars), out = [];
    const mark = (key, i, position, shape, color, text, note) => out.push({ key, time: bars[i].time, position, shape, color, text, note });
    const golden = (key, i, text, note) => mark(key, i, 'belowBar', 'arrowUp', UP, text, note);
    const dead = (key, i, text, note) => mark(key, i, 'aboveBar', 'arrowDown', DOWN, text, note);
    // a가 b를 위로 뚫으면 양수, 아래로 뚫으면 음수
    const crossed = (a, b, i) => a[i - 1] != null && b[i - 1] != null && a[i] != null && b[i] != null
      ? Math.sign(a[i] - b[i]) - Math.sign(a[i - 1] - b[i - 1]) : 0;
    const level = (vals, n) => vals.map(v => v == null ? null : n);
    const each = f => { for (let i = 1; i < bars.length; i++) f(i); };
    if (on.includes('ma')) {
      for (const [f, l] of [[5, 20], [20, 60]]) {
        const fast = sma(c, f), slow = sma(c, l);
        each(i => {
          const d = crossed(fast, slow, i);
          if (d > 0) golden('ma', i, `골든크로스 ${f}·${l}`, `${f}선이 ${l}선을 위로 뚫음: 짧게 본 흐름이 길게 본 흐름보다 강해졌다. 옆으로 기는 장에선 자주 속는다`);
          if (d < 0) dead('ma', i, `데드크로스 ${f}·${l}`, `${f}선이 ${l}선을 아래로 뚫음: 짧게 본 흐름이 약해졌다. 이미 많이 내린 뒤 늦게 나오기도 한다`);
        });
      }
    }
    if (on.includes('bb')) {
      const mid = sma(c, 20), up = bollinger(c, 20, 1), lo = bollinger(c, 20, -1);
      const width = mid.map((m, i) => m == null ? null : (up[i] - lo[i]) / m);
      let squeezed = false;
      each(i => {
        if (crossed(c, up, i) > 0) mark('bb', i, 'aboveBar', 'circle', UP, '상단 돌파', '종가가 볼린저 상단 위로: 평소보다 크게 오름. 과열로 보는 시각과, 처음 뚫은 거라 오르는 힘이 세다(더 간다)는 시각이 갈린다. 거래량이 같이 늘었는지 볼 것');
        if (crossed(c, lo, i) < 0) mark('bb', i, 'belowBar', 'circle', DOWN, '하단 이탈', '종가가 볼린저 하단 아래로: 평소보다 크게 내림. 반등 자리로 보는 시각과, 처음 닿은 거라 내리는 힘이 세다(더 간다)는 시각이 갈린다. 다음 봉들이 밴드 안으로 돌아오는지가 갈림길');
        // 스퀴즈: 밴드 폭이 최근 120봉 중 가장 좁을 때 (처음 좁아진 봉에만 표시)
        const recent = width.slice(Math.max(0, i - 119), i + 1).filter(w => w != null);
        const now = recent.length >= 120 && width[i] <= Math.min(...recent);
        if (now && !squeezed) mark('bb', i, 'aboveBar', 'square', AMBER, '스퀴즈', '밴드 폭이 최근 120봉 중 가장 좁음: 움직임이 잦아든 상태. 이후 크게 움직이는 일이 많지만 방향은 모른다');
        squeezed = now;
      });
    }
    if (on.includes('ichimoku')) {
      const t = midRange(bars, 9), k = midRange(bars, 26);
      each(i => {
        const d = crossed(t, k, i);
        if (d > 0) golden('ichimoku', i, '호전', '전환선이 기준선을 위로 뚫음 (호전): 단기 흐름이 좋아졌다. 구름 위에서 나오면 더 강하게 본다');
        if (d < 0) dead('ichimoku', i, '역전', '전환선이 기준선을 아래로 뚫음 (역전): 단기 흐름이 나빠졌다. 구름 아래에서 나오면 더 약하게 본다');
      });
    }
    if (on.includes('volume')) {
      const vol = bars.map(b => b.volume), avg = sma(vol, 20);
      const surge = i => avg[i - 1] != null && vol[i] >= 2 * avg[i - 1];
      each(i => {
        if (surge(i) && !surge(i - 1)) mark('volume', i, 'belowBar', 'square', PURPLE, '거래량 급증',
          `거래량이 20봉 평균의 ${(vol[i] / avg[i - 1]).toFixed(1)}배: 관심이 크게 몰림. 이 봉이 오른 봉인지 내린 봉인지가 중요하다`);
      });
    }
    if (on.includes('rsi')) {
      const r = rsi(c);
      each(i => {
        if (crossed(r, level(r, 70), i) > 0) mark('rsi', i, 'aboveBar', 'circle', UP, 'RSI 70 진입', 'RSI가 70 위로 (과매수): 최근 오른 힘이 강함. 강세장에선 여기 오래 머물기도 한다');
        if (crossed(r, level(r, 30), i) < 0) mark('rsi', i, 'belowBar', 'circle', DOWN, 'RSI 30 진입', 'RSI가 30 아래로 (과매도): 최근 내린 힘이 강함. 하락장에선 여기 오래 머물기도 한다');
      });
    }
    if (on.includes('macd')) {
      const m = macd(c), sig = macdSignal(c);
      each(i => {
        const d = crossed(m, sig, i);
        if (d > 0) golden('macd', i, 'MACD 골든', 'MACD가 시그널을 위로 뚫음: 오르는 힘이 커지기 시작. 0선 아래에서 나오면 반등, 위에서 나오면 추세가 이어지는 쪽으로 본다');
        if (d < 0) dead('macd', i, 'MACD 데드', 'MACD가 시그널을 아래로 뚫음: 오르는 힘이 줄기 시작');
      });
    }
    return out.sort((a, b) => a.time - b.time);
  }

  // 보는 법 (지표 이름이나 메뉴의 '보는 법'을 누르면 차트 아래에 펼친다)
  const GUIDES = {
    ma: { what: '최근 N개 봉 종가의 평균을 이은 선. 5·20은 짧은 흐름, 60·120은 긴 흐름.',
      read: ['가격이 선 위면 그 기간에 산 사람들이 평균적으로 이익인 상태', '정배열(5>20>60>120)은 상승 추세, 역배열은 하락 추세', '상승 추세에선 20선 근처까지 내려왔다 다시 오르는 눌림이 자주 나온다'],
      caution: '평균이라 늦게 반응한다. 옆으로 기는 장에선 크로스가 자주 나왔다 사라진다(휩쏘).', src: '그랜빌 8법칙 (Granville, 1976)' },
    bb: { what: '20봉 평균선 위아래로 표준편차 2배만큼 띄운 띠. 가격은 대부분 이 띠 안에서 움직인다.',
      read: ['상단 근처는 평소보다 많이 오른 자리, 하단 근처는 많이 내린 자리', '띠가 좁아지면(스퀴즈) 쉬던 가격이 곧 크게 움직이는 일이 많다',
        '해석이 두 갈래다: 밴드 밖은 곧 돌아온다(반등·되돌림)는 시각과, 처음 닿은 건 그 방향 힘이 세다는 뜻이라 더 간다(추세 추종)는 시각',
        '밴드 밖에서 밴드를 끌고 내려가면 가장 가파른 하락. 이때 바닥을 미리 판단하지 않는다'],
      caution: '하단 이탈 = 싸다, 상단 돌파 = 비싸다가 아니다. 강한 추세에선 밴드를 타고 계속 간다(밴드 워킹). RSI·거래량과 같이 본다.',
      src: 'Bollinger on Bollinger Bands (2001) · 추세 추종 해석 예: 유튜브 지표추적자(알상무) 2026.10 코스피 하락 해설' },
    ichimoku: { what: '구름(빨강·파랑 선행스팬 사이)이 지지·저항 역할을 한다. 주황 전환선(9봉), 초록 기준선(26봉), 회색 후행스팬.',
      read: ['가격이 구름 위면 상승 추세, 아래면 하락 추세, 안이면 방향을 찾는 중', '전환선이 기준선 위로 올라가면 호전, 아래로 내려가면 역전', '구름이 두꺼울수록 뚫기 어렵다'],
      caution: '선이 많아 복잡하다. 처음엔 가격이 구름 위인지 아래인지만 봐도 충분하다.', src: '호소다 고이치 (1969 공개)' },
    volume: { what: '그 봉 동안 거래된 주식 수. 빨강은 오른 봉, 파랑은 내린 봉, 주황선은 20봉 평균.',
      read: ['가격이 움직일 때 거래량이 실리면 믿을 만하다', '거래량 없이 나온 돌파는 실패하기 쉽다', '바닥에서 거래량이 크게 터지면 주인이 바뀌는 신호로 보기도 한다'],
      caution: '분봉의 마지막 봉은 아직 거래가 덜 쌓여서 작게 보인다.', src: 'Edwards & Magee, Technical Analysis of Stock Trends (1948)' },
    rsi: { what: '최근 14봉 동안 오른 폭과 내린 폭을 비교한 값 (0~100). 50보다 크면 오른 힘이 더 컸다.',
      read: ['70 이상은 과매수, 30 이하는 과매도 (아래 칸 점선)', '가격은 신고가인데 RSI는 낮아지면(다이버전스) 오르는 힘이 약해졌다는 신호', '50 위면 상승 쪽 힘이 우세'],
      caution: '강세장에선 70 위에 오래 머문다. 70을 넘었다고 바로 팔면 큰 상승을 놓칠 수 있다.', src: 'Wilder, New Concepts in Technical Trading Systems (1978)' },
    macd: { what: '12봉·26봉 지수이동평균의 차이(파랑)와 그 9봉 평균(시그널, 주황). 막대는 둘의 차이.',
      read: ['MACD가 시그널 위로 올라가면 오르는 힘이 커지는 중', '0선(점선) 위면 큰 흐름이 상승, 아래면 하락', '막대가 줄어들면 지금 방향의 힘이 빠지는 중'],
      caution: '이동평균으로 만들어서 늦다. 옆으로 기는 장에선 교차가 잦다.', src: 'Gerald Appel (1970년대)' },
  };
  let guideKey = null, guideFocus = null; // 펼친 지표, 고른 신호
  function openGuide(key) { guideKey = guideKey === key ? null : key; guideFocus = null; menu = null; renderToolbar(); renderGuide(view); }
  function renderGuide(v) {
    const box = document.getElementById('guide');
    const ind = INDICATORS.find(i => i.key === guideKey), g = GUIDES[guideKey];
    box.hidden = !ind || !v;
    if (box.hidden) return box.replaceChildren();
    const mine = (v.signals ?? []).filter(s => s.key === guideKey);
    const kinds = [...new Map(mine.map(s => [s.text, s])).values()];
    const date = t => new Date((t - KST) * 1000).toLocaleString('ko-KR', BUCKET[v.interval]
      ? { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { year: '2-digit', month: 'numeric', day: 'numeric' });
    const icon = s => colored(ICON[s.shape], s.color);
    const off = !v.inds?.includes(ind) ? [el('div', { className: 'caution', style: 'background:#eff6ff;color:#1e40af', textContent: '이 지표는 꺼져 있어요. 켜면 차트에 신호가 표시돼요.' })] : [];
    box.replaceChildren(
      el('div', { className: 'top' }, el('h3', { textContent: ind.name + ' 보는 법' }),
        el('button', { className: 'close', textContent: '×', title: '닫기', onclick: () => openGuide(guideKey) })),
      el('p', { className: 'what', textContent: g.what }),
      ...off,
      el('div', { className: 'cols' },
        el('div', {}, el('h4', { textContent: '이렇게 읽어요' }), el('ul', {}, ...g.read.map(t => el('li', { textContent: t })))),
        el('div', {}, el('h4', { textContent: '차트 위 표시' }), ...(kinds.length
          ? kinds.map(s => el('div', { className: 'sig' }, el('span', { className: 'icon' }, icon(s)), el('span', {}, el('b', { textContent: s.text + ' ' }), s.note)))
          : [el('div', { textContent: '이 차트 구간엔 표시할 신호가 없어요.' })]))),
      el('div', { className: 'caution', textContent: '주의 · ' + g.caution }),
      ...(mine.length ? [el('h4', { textContent: '이 차트에서 찾은 신호 · 누르면 그 자리로 이동', style: 'margin-top:12px' }),
        el('div', { className: 'recent' }, ...mine.slice(-12).reverse().map(s => el('button', { className: guideFocus === s ? 'on' : '', onclick: () => focusSignal(v, s) },
          icon(s), ' ' + s.text + ' · ' + date(s.time))))] : []),
      ...(guideFocus ? [el('div', { className: 'focus', style: 'color:' + guideFocus.color },
        el('b', { textContent: date(guideFocus.time) + ' ' + guideFocus.text }), el('div', { textContent: guideFocus.note, style: 'color:var(--text)' }))] : []),
      el('div', { className: 'src', textContent: '출처: ' + g.src + ' · 판단을 돕는 참고 정보이고 매매 신호가 아니에요' }));
  }
  // 표시가 있는 봉에 커서를 대면 그 옆에 말풍선 (오른쪽에 자리가 없으면 왼쪽)
  function showTip(v, p) {
    const box = document.getElementById('tip');
    const marks = p.time == null || !p.point ? [] : (v.signals ?? []).filter(s => s.time === p.time);
    box.hidden = !marks.length;
    if (!marks.length) return;
    const bar = v.bars.find(b => b.time === p.time);
    const y = v.main.priceToCoordinate(marks[0].position === 'aboveBar' ? bar.high : bar.low) ?? p.point.y;
    const date = new Date((p.time - KST) * 1000).toLocaleString('ko-KR', BUCKET[v.interval]
      ? { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' } : { year: 'numeric', month: 'numeric', day: 'numeric' });
    box.style.color = marks[0].color;
    box.replaceChildren(el('div', { className: 'when', textContent: date }),
      ...marks.map(s => el('p', {}, el('b', {}, ICON[s.shape] + ' ' + s.text), s.note)));
    const chartEl = document.getElementById('chart');
    const right = p.point.x + 20, fits = right + box.offsetWidth < chartEl.clientWidth - 70; // 70: 가격 눈금
    box.style.left = (fits ? right : Math.max(4, p.point.x - box.offsetWidth - 20)) + 'px';
    box.style.top = Math.max(4, Math.min(y - box.offsetHeight / 2, MAIN_HEIGHT - box.offsetHeight - 4)) + 'px';
  }

  // 신호 자리로 차트를 옮기고 그 봉에 십자선을 둔다
  function focusSignal(v, s) {
    guideFocus = s;
    const i = v.bars.findIndex(b => b.time === s.time);
    v.chart.timeScale().setVisibleLogicalRange({ from: i - 60, to: i + 20 });
    // 범위 이동은 다음 화면에 반영되고 십자선은 화면 좌표로 남아서, 이동이 끝난 뒤에 둔다
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.chart.setCrosshairPosition(v.bars[i].close, s.time, v.main);
      // 코드로 옮긴 십자선은 커서 위치를 주지 않아서 말풍선 자리를 직접 잡는다
      showTip(v, { time: s.time, point: { x: v.chart.timeScale().timeToCoordinate(s.time), y: v.main.priceToCoordinate(v.bars[i].close) } });
    }));
    renderGuide(v);
  }

  // 지금 상태: 켜 둔 지표마다 [이름, 상태, 보통 이렇게 읽음 · 주의할 점]
  function status(bars, on) {
    const c = closes(bars), i = c.length - 1, last = c[i], rows = [];
    const pct = (a, b) => (a / b - 1) * 100;
    const signed = n => (n >= 0 ? '+' : '') + n.toFixed(1);
    if (on.includes('ma')) {
      const [m5, m20, m60, m120] = [5, 20, 60, 120].map(n => sma(c, n)[i]);
      if (m120 != null) {
        const order = m5 > m20 && m20 > m60 && m60 > m120 ? ['정배열 (5>20>60>120)', '짧게 보나 길게 보나 오르는 흐름. 추세가 이어지는 동안은 눌림(20선 근처)을 기다리는 사람이 많다']
          : m5 < m20 && m20 < m60 && m60 < m120 ? ['역배열 (5<20<60<120)', '짧게 보나 길게 보나 내리는 흐름. 반등이 나와도 위의 이동평균선에서 막히기 쉽다']
          : ['섞여 있음', '추세가 뚜렷하지 않거나 바뀌는 중. 크로스 신호가 자주 속는 구간'];
        rows.push(['이동평균선', order[0] + ` · 현재가는 20선 대비 ${signed(pct(last, m20))}%`, order[1]]);
      }
    }
    if (on.includes('bb')) {
      const mid = sma(c, 20), up = bollinger(c, 20, 1), lo = bollinger(c, 20, -1);
      if (mid[i] != null) {
        const z = 2 * (last - mid[i]) / (up[i] - mid[i]);
        const width = mid.map((m, k) => m == null ? null : (up[k] - lo[k]) / m).slice(-120).filter(w => w != null);
        const rank = width.filter(w => w < width.at(-1)).length / width.length;
        const where = z >= 2 ? ['상단 위', '평소보다 많이 오른 자리(과열권). 단, 강한 상승장에선 상단을 타고 계속 오르기도 한다(밴드 워킹)']
          : z <= -2 ? ['하단 아래', '평소보다 많이 내린 자리. 반등을 기대하는 시각도 있지만, 밴드 밖에서 계속 내려가는 중이면 바닥 판단은 이르다']
          : [z >= 0 ? '중심선 위' : '중심선 아래', '밴드 안: 평소 움직임 범위'];
        const squeeze = width.length >= 60 && rank <= 0.1 ? ' · 밴드 폭이 최근 중 가장 좁은 편(스퀴즈)' : '';
        rows.push(['볼린저밴드', `${where[0]} (${signed(z)}σ)${squeeze}`, where[1]]);
      }
    }
    if (on.includes('ichimoku') && bars.length > 52 + 26) {
      const t = midRange(bars, 9), k = midRange(bars, 26);
      const a = (t[i - 26] + k[i - 26]) / 2, b = midRange(bars, 52)[i - 26];
      const where = last > Math.max(a, b) ? ['구름 위', '상승 추세로 본다. 구름이 아래에서 받쳐 주는 자리']
        : last < Math.min(a, b) ? ['구름 아래', '하락 추세로 본다. 구름이 위에서 누르는 자리']
        : ['구름 안', '방향을 찾는 중. 구름을 어느 쪽으로 빠져나가는지 본다'];
      rows.push(['일목균형표', where[0], where[1]]);
    }
    if (on.includes('volume')) {
      const avg = sma(bars.map(b => b.volume), 20)[i];
      if (avg) {
        const r = bars[i].volume / avg;
        rows.push(['거래량', `20봉 평균의 ${r.toFixed(1)}배`, r >= 2 ? '평소보다 많이 거래됨. 가격 움직임에 힘이 실렸다는 뜻 (진행 중인 봉은 아직 덜 쌓였을 수 있음)'
          : r <= 0.5 ? '거래가 적음. 이때 나온 돌파·이탈은 믿기 어렵다' : '평소 수준']);
      }
    }
    if (on.includes('rsi')) {
      const r = rsi(c)[i];
      if (r != null) rows.push(['RSI', r.toFixed(0), r >= 70 ? '70 이상 과매수: 최근 오른 힘이 강함. 강세장에선 70 위에 오래 머물기도 한다'
        : r <= 30 ? '30 이하 과매도: 최근 내린 힘이 강함. 하락장에선 30 아래에 오래 머물기도 한다' : '30~70 중립']);
    }
    if (on.includes('macd')) {
      const m = macd(c)[i], sig = macdSignal(c)[i];
      if (m != null && sig != null) rows.push(['MACD', `${m >= sig ? '시그널 위' : '시그널 아래'} · 0선 ${m >= 0 ? '위' : '아래'}`,
        (m >= sig ? '오르는 힘이 커지는 중' : '오르는 힘이 줄어드는 중') + (m >= 0 ? ', 큰 흐름은 상승 쪽' : ', 큰 흐름은 하락 쪽') + '. 이동평균 기반이라 늦게 반응한다']);
    }
    return rows;
  }

  function renderStatus(v) {
    const rows = v?.bars?.length ? status(v.bars, v.inds.map(i => i.key)) : [];
    document.getElementById('status').replaceChildren(...rows.map(([name, state, why]) =>
      el('div', {}, el('b', { textContent: name + ' ' }), state + ' ', el('span', { className: 'why', textContent: '· ' + why }))));
  }

  // 차트 설정은 브라우저에 기억 (없거나 막혀 있으면 기본값)
  const prefs = { interval: '1m', intraday: '1m', type: 'candle', on: ['ma', 'volume'], hidden: [] };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem('chartPrefs')) ?? {}); } catch {}
  const savePrefs = () => { try { localStorage.setItem('chartPrefs', JSON.stringify(prefs)); } catch {} };

  let view = null;   // { code, interval, type, chart, main, plots, bars, compares, hover }
  let menu = null;   // 'ind' | 'compare'
  let tool = null;   // 'draw' | 'measure'
  let pending = null; // 그리기·자의 첫 번째 클릭 지점
  let compares = [];  // 비교 중인 종목 코드
  let measureSeries = null;
  const drawings = new Map(); // '종목|주기' → [[점1, 점2], ...] (새로고침하면 사라짐)

  const point = (time, v) => typeof v === 'object' ? { time, ...v } : { time, value: v };
  const toData = (bars, vals) => vals.flatMap((val, i) => val == null ? [] : [point(bars[i].time, val)]);
  const fmt = n => n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const colored = (text, color) => { const e = el('span', { textContent: text }); e.style.color = color; return e; };
  const drawKey = () => view?.code + '|' + prefs.interval;
  const btn = (text, onclick, active = false, title = '') => el('button', { textContent: text, onclick, title, className: active ? 'active' : '' });

  function renderToolbar() {
    const intraday = INTRADAY.some(([k]) => k === prefs.interval);
    const select = el('select', { className: intraday ? 'active' : '', title: '분·틱 단위', onchange: e => changeInterval(e.target.value) },
      ...INTRADAY.map(([k, label]) => el('option', { value: k, textContent: label, selected: k === prefs.intraday })));
    const left = [select, ...PERIODS.map(([k, label]) => btn(label, () => changeInterval(k), k === prefs.interval)),
      el('span', { className: 'sep' }),
      btn(prefs.type === 'candle' ? '캔들' : '라인', () => { prefs.type = prefs.type === 'candle' ? 'line' : 'candle'; savePrefs(); loadChart(true); }, false, '차트 종류 바꾸기'),
      btn('지우기', () => { drawings.delete(drawKey()); loadChart(true); }, false, '그린 선과 자 지우기')];
    const right = [
      btn('+ 보조지표', () => toggleMenu('ind'), menu === 'ind'),
      btn('그리기', () => setTool('draw'), tool === 'draw', '두 지점을 클릭해 추세선 긋기'),
      btn('자', () => setTool('measure'), tool === 'measure', '두 지점을 클릭해 등락률·봉 개수 재기'),
      btn('종목비교', () => toggleMenu('compare'), menu === 'compare' || compares.length > 0),
      btn('차트 크게보기', () => document.fullscreenElement ? document.exitFullscreen() : document.getElementById('chartBox').requestFullscreen()),
    ];
    document.getElementById('toolbar').replaceChildren(
      el('div', { className: 'group' }, ...left), el('div', { className: 'group' }, ...right), menuPanel());
  }

  function menuPanel() {
    if (menu === 'ind') {
      return el('div', { className: 'menu' }, ...INDICATORS.map(ind => el('label', {},
        el('input', { type: 'checkbox', checked: prefs.on.includes(ind.key), onchange: () => toggleIndicator(ind.key) }), ind.name,
        el('button', { textContent: '보는 법', onclick: e => { e.preventDefault(); openGuide(ind.key); } }))));
    }
    if (menu === 'compare') {
      const others = stockList.filter(s => s.stockCode !== selected?.stockCode);
      return el('div', { className: 'menu' }, ...(others.length
        ? others.map(s => el('label', {}, el('input', { type: 'checkbox', checked: compares.includes(s.stockCode),
            onchange: () => toggleCompare(s.stockCode) }), s.name + ' ' + s.stockCode))
        : [el('span', { textContent: '비교할 다른 팔로우 종목이 없어요' })]));
    }
    return '';
  }

  // 메뉴 밖을 누르면 닫기
  document.addEventListener('click', e => {
    // 툴바는 클릭할 때마다 다시 그려져서 눌린 요소가 이미 빠져 있을 수 있다 (isConnected)
    if (menu && e.target.isConnected && !e.target.closest('#toolbar')) { menu = null; renderToolbar(); }
  });

  function toggleMenu(m) { menu = menu === m ? null : m; renderToolbar(); }
  function setTool(t) {
    tool = tool === t ? null : t;
    pending = null;
    document.getElementById('chart').style.cursor = tool ? 'crosshair' : '';
    renderToolbar();
  }
  function changeInterval(k) {
    prefs.interval = k;
    if (INTRADAY.some(([key]) => key === k)) prefs.intraday = k;
    savePrefs();
    loadChart();
  }
  function toggleIndicator(key) {
    prefs.on = prefs.on.includes(key) ? prefs.on.filter(k => k !== key) : [...prefs.on, key];
    prefs.hidden = prefs.hidden.filter(k => k !== key);
    savePrefs();
    loadChart(true);
  }
  function toggleHidden(key) {
    prefs.hidden = prefs.hidden.includes(key) ? prefs.hidden.filter(k => k !== key) : [...prefs.hidden, key];
    savePrefs();
    view?.plots.filter(p => p.ind.key === key).forEach(p => p.series.applyOptions({ visible: !prefs.hidden.includes(key) }));
    renderLegend(view, view?.bars?.at(-1));
  }
  function toggleCompare(code) {
    compares = compares.includes(code) ? compares.filter(c => c !== code) : [...compares, code];
    loadChart(true);
  }

  // 범례: 시작·고가·저가·종가 + 지표마다 [보기/숨기기] [삭제] 이름 숫자
  function renderLegend(v, bar) {
    const box = document.getElementById('legend');
    if (!v?.bars || !bar) { box.replaceChildren(); return; }
    const prev = v.bars[v.bars.indexOf(bar) - 1];
    const base = prev?.close ?? bar.open;
    const dir = val => val >= base ? 'up' : 'down';
    const rate = prev ? (bar.close / prev.close - 1) * 100 : null;
    const rows = [el('div', { className: 'row' },
      ...[['시작', bar.open], ['고가', bar.high], ['저가', bar.low], ['종가', bar.close]].map(([k, val]) =>
        el('span', {}, k + ' ', el('b', { className: dir(val), textContent: fmt(val) }))),
      rate == null ? '' : el('b', { className: dir(bar.close), textContent: (rate >= 0 ? '+' : '') + rate.toFixed(2) + '%' }),
      el('span', { textContent: '거래량 ' + bar.volume.toLocaleString('en-US') }))];
    // 지표는 한 줄에 모아서 차트를 덜 가린다. 이름을 누르면 보는 법
    const chips = INDICATORS.filter(ind => v.plots.some(p => p.ind === ind)).map(ind => {
      const hidden = prefs.hidden.includes(ind.key);
      return el('span', { className: 'chip' + (hidden ? ' off' : '') },
        btn(hidden ? '○' : '●', () => toggleHidden(ind.key), false, hidden ? '보이기' : '숨기기'),
        btn('×', () => toggleIndicator(ind.key), false, '지표 삭제'),
        el('span', { className: 'name', textContent: ind.name, title: '보는 법', onclick: () => openGuide(ind.key) }),
        ...ind.lines.filter(l => l.label).map(l => colored(String(l.label), l.color)));
    });
    if (chips.length) rows.push(el('div', { className: 'row' }, ...chips));
    for (const c of v.compares) {
      rows.push(el('div', { className: 'row' }, btn('×', () => toggleCompare(c.code), false, '비교 해제'), colored('비교 ' + c.code + ' (%)', c.color)));
    }
    box.replaceChildren(...rows);
  }

  async function fetchBars(code, interval) {
    const res = await fetch('/api/candles?symbol=' + encodeURIComponent(code) + '&interval=' + interval);
    if (!res.ok) return null;
    return (await res.json()).map(b => ({ time: b.time, open: +b.open, high: +b.high, low: +b.low, close: +b.close, volume: +b.volume }));
  }

  async function loadChart(force = false) {
    const code = selected?.stockCode ?? null;
    document.getElementById('chartBox').hidden = !code;
    if (code !== view?.code) { compares = []; tool = null; pending = null; menu = null; }
    if (!force && code === view?.code && prefs.interval === view?.interval) return;
    clearMeasure();
    view?.chart.remove();
    view = null;
    renderLegend(null);
    renderStatus(null);
    renderGuide(null);
    if (!code) return;
    renderToolbar();
    const interval = prefs.interval, tick = interval === 'tick';
    // 비교 중에는 % 눈금이라 가격 기준 지표(이동평균 등)는 빼고 아래 칸 지표만 남긴다
    const inds = tick ? [] : INDICATORS.filter(i => prefs.on.includes(i.key) && (i.pane || !compares.length));
    const panes = inds.filter(i => i.pane);
    document.getElementById('chartWrap').style.height = (MAIN_HEIGHT + panes.length * PANE_HEIGHT) + 'px';
    const times = [];
    const tickLabel = i => times[i - 1] ? new Date(times[i - 1]).toLocaleTimeString('ko-KR') : '';
    const chart = LC.createChart(document.getElementById('chart'), {
      autoSize: true,
      layout: { fontSize: 11, panes: { separatorColor: '#e5e7eb' } },
      grid: { vertLines: { color: '#f1f3f5' }, horzLines: { color: '#f1f3f5' } },
      crosshair: { mode: LC.CrosshairMode.Normal },
      timeScale: tick ? { tickMarkFormatter: tickLabel } : { timeVisible: !!BUCKET[interval] },
      localization: tick ? { timeFormatter: tickLabel } : {},
    });
    if (tick) {
      const main = chart.addSeries(LC.BaselineSeries, {
        topLineColor: UP, topFillColor1: 'rgba(220,38,38,0.2)', topFillColor2: 'rgba(220,38,38,0.02)',
        bottomLineColor: DOWN, bottomFillColor1: 'rgba(37,99,235,0.02)', bottomFillColor2: 'rgba(37,99,235,0.2)' });
      // 틱은 저장하지 않는다. 페이지를 연 뒤 들어오는 실시간 체결만 그린다
      view = { code, interval, chart, main, times, plots: [], compares: [] };
      return;
    }
    const type = prefs.type;
    const main = type === 'candle'
      ? chart.addSeries(LC.CandlestickSeries, { upColor: UP, downColor: DOWN, borderVisible: false, wickUpColor: UP, wickDownColor: DOWN })
      : chart.addSeries(LC.LineSeries, { color: '#111827', lineWidth: 2 });
    const plots = inds.flatMap(ind => {
      const paneIndex = ind.pane ? panes.indexOf(ind) + 1 : 0;
      return ind.lines.map(line => ({ ind, line, series: chart.addSeries(line.type ?? LC.LineSeries, {
        color: line.color, lineWidth: 1, ...line.options, priceLineVisible: false, lastValueVisible: !!ind.pane,
        crosshairMarkerVisible: false, visible: !prefs.hidden.includes(ind.key) }, paneIndex) }));
    });
    // 높이 비율: 메인 420 : 아래 칸 110씩 (autoSize라 픽셀 대신 비율로 준다)
    chart.panes().forEach((p, i) => p.setStretchFactor(i === 0 ? MAIN_HEIGHT : PANE_HEIGHT));
    const v = view = { code, interval, type, chart, main, plots, inds, bars: [], compares: [], hover: false };
    chart.subscribeCrosshairMove(p => {
      showTip(v, p);
      v.hover = p.time != null;
      renderLegend(v, (p.time != null && v.bars.find(b => b.time === p.time)) || v.bars.at(-1));
    });
    chart.subscribeClick(p => onChartClick(v, p));
    chart.subscribeDblClick(p => onChartClick(v, p)); // 빠르게 두 번 누르면 두 번째는 더블클릭으로만 온다
    const [bars, ...others] = await Promise.all([code, ...compares].map(c => fetchBars(c, interval)));
    if (view !== v || !bars) return;
    v.bars = bars;
    main.setData(type === 'candle' ? bars : bars.map(b => ({ time: b.time, value: b.close })));
    plots.forEach(p => p.series.setData(toData(bars, p.line.calc(bars))));
    // ponytail: 표시는 차트를 열 때만 다시 찾는다 (실시간 체결로 새로 생긴 크로스는 다시 열어야 보임). 지금 상태 칸은 체결마다 갱신
    v.signals = signals(bars, inds.map(i => i.key));
    // 차트엔 모양만 (글자를 달면 봉과 겹친다). 이름·설명은 범례(마우스 올린 봉)와 보는 법 카드에
    LC.createSeriesMarkers(main, v.signals.map(({ time, position, shape, color }) => ({ time, position, shape, color })));
    const guide = (key, price, title, color) => plots.find(p => p.ind.key === key && p.line.label)?.series
      .createPriceLine({ price, title, color, lineWidth: 1, lineStyle: LC.LineStyle.Dashed, axisLabelVisible: false });
    guide('rsi', 70, '과매수', UP);
    guide('rsi', 30, '과매도', DOWN);
    guide('macd', 0, '0', '#9ca3af');
    renderStatus(v);
    renderGuide(v);
    compares.forEach((c, i) => {
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      const series = chart.addSeries(LC.LineSeries, { color, lineWidth: 2, priceLineVisible: false });
      series.setData((others[i] ?? []).map(b => ({ time: b.time, value: b.close })));
      v.compares.push({ code: c, series, color, bars: others[i] ?? [] });
    });
    // 종목비교는 토스처럼 % 눈금 (각 선의 화면 첫 값 대비 등락률)
    if (compares.length) main.priceScale().applyOptions({ mode: LC.PriceScaleMode.Percentage });
    (drawings.get(drawKey()) ?? []).forEach(pts => addLine(v, pts, '#111827', LC.LineStyle.Solid));
    renderLegend(v, bars.at(-1));
  }

  // 그리기·자: 두 번 클릭. 그리기는 추세선을 남기고, 자는 두 점 사이 등락률과 봉 개수를 보여준다
  function onChartClick(v, p) {
    if (!tool || !p.point || p.time == null) return;
    const pt = { time: p.time, price: v.main.coordinateToPrice(p.point.y) };
    if (!pending) { pending = pt; return; }
    const [a, b] = [pending, pt].sort((x, y) => x.time - y.time);
    pending = null;
    if (a.time === b.time) return;
    if (tool === 'draw') {
      drawings.set(drawKey(), [...(drawings.get(drawKey()) ?? []), [a, b]]);
      addLine(v, [a, b], '#111827', LC.LineStyle.Solid);
      return;
    }
    clearMeasure();
    const change = (b.price / a.price - 1) * 100;
    // 틱 차트는 가로축이 체결 순번이라 차이가 곧 체결 수
    const count = v.bars ? v.bars.filter(x => x.time > a.time && x.time <= b.time).length : b.time - a.time;
    measureSeries = addLine(v, [a, b], change >= 0 ? UP : DOWN, LC.LineStyle.Dashed);
    const box = document.getElementById('measure');
    box.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '% (' + (change >= 0 ? '+' : '') + fmt(b.price - a.price) + ') · ' + count + '봉';
    box.className = change >= 0 ? 'up' : 'down';
    box.style.left = (p.point.x + 12) + 'px';
    box.style.top = p.point.y + 'px';
    box.hidden = false;
  }

  function addLine(v, [a, b], color, lineStyle) {
    const s = v.chart.addSeries(LC.LineSeries, { color, lineWidth: 2, lineStyle, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData([{ time: a.time, value: a.price }, { time: b.time, value: b.price }]);
    return s;
  }

  function clearMeasure() {
    if (measureSeries && view) view.chart.removeSeries(measureSeries);
    measureSeries = null;
    document.getElementById('measure').hidden = true;
  }

  // 체결 한 건을 봉 배열에 반영하고 바뀐 봉을 돌려준다 (늦게 온 체결이면 null)
  function applyTrade(bars, q, interval) {
    const last = bars.at(-1);
    if (!last) return null;
    const price = +q.lastPrice;
    const t = Math.floor(Date.parse(q.timestamp) / 1000) + KST;
    const size = BUCKET[interval];
    // 일·주·월·년봉은 토스 거래일 경계가 자정이 아니라 새 봉을 열지 않고 마지막 봉만 갱신
    const time = size ? t - t % size : last.time;
    if (time < last.time) return null;
    const qty = +(q.volume ?? 0);
    const bar = time === last.time
      ? { ...last, high: Math.max(last.high, price), low: Math.min(last.low, price), close: price, volume: last.volume + qty }
      : { time, open: price, high: price, low: price, close: price, volume: qty };
    if (time === last.time) bars[bars.length - 1] = bar; else bars.push(bar);
    return bar;
  }

  // 체결 한 건 반영: 틱은 점 추가, 캔들은 현재 봉·지표·비교선 갱신
  // ponytail: 체결마다 지표 전체를 다시 계산한다 (봉 최대 수천 개라 충분히 빠름). 느려지면 마지막 값만 증분 계산할 것
  function onTradeChart(q) {
    const v = view;
    if (!v) return;
    if (v.interval === 'tick') {
      if (q.stockCode !== v.code) return;
      if (!v.times.length) v.main.applyOptions({ baseValue: { type: 'price', price: +(q.prevClose ?? q.lastPrice) } });
      v.times.push(q.timestamp);
      v.main.update({ time: v.times.length, value: +q.lastPrice });
      return;
    }
    for (const c of v.compares) {
      if (c.code !== q.stockCode) continue;
      const bar = applyTrade(c.bars, q, v.interval);
      if (bar) c.series.update({ time: bar.time, value: bar.close });
    }
    if (q.stockCode !== v.code) return;
    const bar = applyTrade(v.bars, q, v.interval);
    if (!bar) return;
    v.main.update(v.type === 'candle' ? bar : { time: bar.time, value: bar.close });
    v.plots.forEach(p => { const val = p.line.calc(v.bars).at(-1); if (val != null) p.series.update(point(bar.time, val)); });
    if (!v.hover) renderLegend(v, bar);
    renderStatus(v);
  }

  // 종목 헤더: 이름·코드·현재가·전일 대비 (토스 종목 화면 맨 위)
  // 체결마다(1초에 여러 번) 불리므로 종목이 바뀔 때만 새로 만들고 가격은 글자만 바꾼다
  // 통째로 다시 만들면 ← 버튼을 누르는 사이에 버튼이 바뀌어 클릭이 사라진다 (20번 중 8번 실패)
  const quotes = new Map(); // 종목 → 최신 시세 (/api/quotes + 실시간 체결)
  function renderHead() {
    const head = document.getElementById('head');
    const code = selected?.stockCode;
    head.hidden = !code;
    if (!code) return;
    const s = stockList.find(x => x.stockCode === code);
    const q = quotes.get(code);
    const key = code + '|' + (s?.name ?? '') + '|' + (s?.industry ?? '');
    if (head.dataset.key !== key) {
      head.dataset.key = key;
      head.replaceChildren(
        el('button', { className: 'back', textContent: '←', title: '전체 뉴스로', onclick: () => select(null) }),
        el('div', {},
          el('div', { className: 'name' }, el('b', { textContent: s?.name ?? code }),
            el('small', { textContent: code + (s?.industry ? ' · ' + s.industry : '') })),
          el('div', { className: 'price' }, el('span', { className: 'last' }), el('span', { className: 'chg' }))));
    }
    head.querySelector('.last').textContent = q ? priceText(q) : '-';
    const chg = head.querySelector('.chg');
    chg.className = 'chg ' + dirClass(q?.changeRate);
    chg.textContent = q ? changeText(q) : '';
  }

  // 피드 탭 (토스 종목 화면 아래 탭처럼)
  const TABS = [['NEWS', '뉴스'], ['DISCLOSURE', '공시'], ['MOVE', '급등락'], ['MARKET', '시장']];
  let feedType = 'NEWS';
  function renderTabs() {
    document.getElementById('tabs').replaceChildren(...TABS.map(([type, label]) =>
      el('button', { textContent: label, className: type === feedType ? 'active' : '', onclick: () => { feedType = type; disc = null; renderTabs(); loadFeed(); } })));
  }

  // 오른쪽 호가·체결. 처음엔 REST로 받고 이후는 SSE(orderbook, trade)로 갱신
  const BOOK_DEPTH = 10;
  let side = { code: null, book: null, trades: [], investors: null, error: '' };
  const isKoreanCode = code => /^\d{6}$/.test(code);
  async function loadSide() {
    const code = selected?.stockCode ?? null;
    if (code === side.code) return;
    const s = side = { code, book: null, trades: [], investors: null, error: '' };
    renderSide();
    if (!code) return;
    const q = '?symbol=' + encodeURIComponent(code);
    const [book, trades, investors] = await Promise.all([
      fetch('/api/orderbook' + q).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/trades' + q).then(r => r.ok ? r.json() : null).catch(() => null),
      // 투자자별 매매동향은 국내 종목만 있다
      isKoreanCode(code) ? fetch('/api/investors' + q).then(r => r.ok ? r.json() : []).catch(() => []) : null]);
    s.investors = investors;
    if (side !== s) return; // 그사이 다른 종목을 골랐다
    if (!book && !trades) s.error = '토스 시세를 불러올 수 없어요 (secret.yml 토스 키·허용 IP 확인)';
    s.book = s.book ?? book; // 기다리는 동안 SSE로 더 최신 호가가 왔으면 그걸 쓴다
    // 기다리는 동안 SSE로 온 체결은 스냅샷에도 들어 있을 수 있어, 그보다 오래된 것만 붙인다
    const oldestLive = s.trades.at(-1)?.timestamp;
    const older = (trades ?? []).filter(t => !oldestLive || Date.parse(t.timestamp) < Date.parse(oldestLive));
    s.trades = [...s.trades, ...older].slice(0, 50);
    renderSide();
  }

  // 호가·체결은 초당 여러 번 올 수 있어 화면은 한 프레임에 한 번만 다시 그린다
  let sideFrame = 0;
  function scheduleSide() {
    if (!sideFrame) sideFrame = requestAnimationFrame(() => { sideFrame = 0; renderSide(); renderHead(); });
  }

  function renderSide() { renderBook(); renderTrades(); renderInvestors(); }

  // 하루치 순매수 수량(주). 당일 잠정치는 개인이 아직 없다 (다음 영업일 새벽 확정)
  function renderInvestors() {
    const list = side.investors;
    document.getElementById('investorBox').hidden = list === null;
    if (list === null) return;
    const box = document.getElementById('investors');
    const rate = list.find(d => d.foreignerHoldingRate != null)?.foreignerHoldingRate;
    document.getElementById('holding').textContent = rate == null ? '' : '외국인 보유 ' + (rate * 100).toFixed(2) + '%';
    if (!list.length) { box.replaceChildren(el('div', { className: 'empty', textContent: '투자자 동향을 불러올 수 없어요' })); return; }
    const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); // 2026-10-23
    const cell = v => v == null
      ? el('span', { textContent: '집계 중' })
      : el('span', { className: dirClass(v), textContent: (v > 0 ? '+' : '') + v.toLocaleString('en-US') });
    box.replaceChildren(
      el('div', { className: 'irow head' }, ...['날짜', '개인', '외국인', '기관'].map(t => el('span', { textContent: t }))),
      ...list.map(d => el('div', { className: 'irow' },
        el('span', {}, d.date.slice(5).replace('-', '.'), d.date === today ? el('small', { textContent: ' 잠정' }) : ''),
        cell(d.individual), cell(d.foreigner), cell(d.institution))));
  }

  function renderBook() {
    const box = document.getElementById('book');
    if (!side.book) { box.replaceChildren(el('div', { className: 'empty', textContent: side.error || '호가를 불러오는 중…' })); return; }
    const { currency } = side.book;
    const asks = (side.book.asks ?? []).slice(0, BOOK_DEPTH).reverse(); // 높은 가격이 위로
    const bids = (side.book.bids ?? []).slice(0, BOOK_DEPTH);
    const max = Math.max(1, ...[...asks, ...bids].map(l => +l.volume));
    const q = quotes.get(side.code);
    const prev = q?.prevClose == null ? null : +q.prevClose;
    const row = (l, kind) => {
      const vol = el('span', { className: 'vol', textContent: (+l.volume).toLocaleString('en-US') });
      vol.style.setProperty('--w', (+l.volume / max * 100).toFixed(1) + '%');
      const rate = prev ? (+l.price / prev - 1) * 100 : null;
      const px = el('span', { className: 'px ' + dirClass(rate) }, el('b', { textContent: num(l.price, currency) }),
        el('small', { textContent: rate == null ? '' : (rate > 0 ? '+' : '') + rate.toFixed(2) + '%' }));
      return el('div', { className: 'lvl ' + kind + (q && +l.price === +q.lastPrice ? ' now' : '') },
        kind === 'ask' ? vol : el('span'), px, kind === 'bid' ? vol : el('span'));
    };
    box.replaceChildren(...asks.map(l => row(l, 'ask')), ...bids.map(l => row(l, 'bid')));
  }

  function renderTrades() {
    const box = document.getElementById('trades');
    if (!side.trades.length) { box.replaceChildren(el('div', { className: 'empty', textContent: side.error || '아직 체결이 없어요' })); return; }
    const time = t => new Date(t).toLocaleTimeString('en-GB'); // 10:17:11
    box.replaceChildren(
      el('div', { className: 'trow head' }, el('span', { textContent: '시간' }), el('span', { textContent: '체결가' }), el('span', { textContent: '수량' })),
      ...side.trades.map((t, i) => {
        const older = side.trades[i + 1];
        return el('div', { className: 'trow' }, el('span', { textContent: time(t.timestamp) }),
          el('span', { className: older ? dirClass(t.price - older.price) : '', textContent: num(t.price, t.currency) }),
          el('span', { textContent: (+t.volume).toLocaleString('en-US') }));
      }));
  }

  function stockRow(s, q) {
    const del = el('button', { textContent: '×', title: '팔로우 해제', onclick: async ev => {
      ev.stopPropagation();
      await fetch('/api/stocks/' + encodeURIComponent(s.stockCode), { method: 'DELETE' });
      if (selected?.stockCode === s.stockCode) select(null); else refresh();
    }});
    const active = selected?.stockCode === s.stockCode ? ' active' : '';
    return el('div', { className: 'stock indent' + active, onclick: () => select({ stockCode: s.stockCode, label: s.name }) },
      el('span', {}, s.name, el('small', { textContent: s.stockCode })), withCode(quoteBox(q), s.stockCode), del);
  }

  // 상단 지표 띠. 그래프는 최근 2시간 1분봉 종가, 전일 종가보다 높으면 빨강
  async function loadIndicators() {
    const list = await fetch('/api/indicators').then(r => r.ok ? r.json() : []).catch(() => []);
    const ticker = document.getElementById('ticker');
    if (!list.length) return ticker.replaceChildren();
    const item = i => {
      const color = i.changeRate > 0 ? UP : i.changeRate < 0 ? DOWN : '#9ca3af';
      return el('div', { className: 'ind' },
        el('span', { textContent: i.label }),
        el('b', { textContent: i.last == null ? '-' : (+i.last).toLocaleString('en-US', { maximumFractionDigits: 2 }) }),
        el('span', { className: dirClass(i.changeRate), textContent: i.changeRate == null ? '' : (i.changeRate > 0 ? '+' : '') + (+i.changeRate).toFixed(2) + '%' }),
        ...(i.spark.length > 1 ? [spark(i.spark.map(Number), color)] : []));
    };
    const copy = cls => el('div', { className: 'track-copy ' + cls, style: 'display:flex' }, ...list.map(item));
    ticker.replaceChildren(el('div', { className: 'track' }, copy(''), copy('copy')));
  }
  function spark(values, color) {
    const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const points = values.map((v, i) => (i / (values.length - 1) * 60).toFixed(1) + ',' + (18 - (v - min) / span * 16).toFixed(1)).join(' ');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 60 20');
    svg.setAttribute('aria-hidden', 'true');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '1.5');
    svg.append(line);
    return svg;
  }

  // 업종별로 묶어서 보여준다. 업종 제목을 누르면 그 업종 전체 피드
  async function loadStocks() {
    // 시세가 실패해도 종목 목록은 보여준다
    const [stocks, latest] = await Promise.all([
      fetch('/api/stocks').then(r => r.json()),
      fetch('/api/quotes').then(r => r.ok ? r.json() : []).catch(() => []),
    ]);
    latest.forEach(q => quotes.set(q.stockCode, q));
    const quoteOf = quotes;
    stockList = stocks;
    const groups = Map.groupBy(stocks, s => s.industry ?? NO_INDUSTRY);
    const box = document.getElementById('stocks');
    box.replaceChildren(el('div', { className: 'stock' + (selected ? '' : ' active'), textContent: '전체', onclick: () => select(null) }));
    for (const [industry, list] of [...groups].sort(([a], [b]) => a.localeCompare(b))) {
      const clickable = industry !== NO_INDUSTRY;
      box.append(el('div', {
        className: 'group' + (selected?.industry === industry ? ' active' : ''),
        onclick: () => clickable && select({ industry, label: industry }),
      }, el('span', { textContent: industry }), el('span', { textContent: list.length })));
      list.forEach(s => box.append(stockRow(s, quoteOf.get(s.stockCode))));
    }
  }

  // 종목 페이지 공시 탭: 최근 3개월 공시를 DART(국내)·SEC(미국)에서 2건 먼저, '더 보기'로 10건씩 더 받는다
  // 1분마다 도는 갱신에서 펼친 목록이 접히지 않도록 받은 것을 들고 있는다 (탭을 다시 누르면 새로 받음)
  // 임원 지분 보고 같은 사소한 공시는 기본으로 숨긴다 (토글로 보기)
  let disc = null; // { code, items, nextOffset }
  let showMinor = false;
  async function loadDisclosures(more) {
    const code = selected.stockCode;
    const feed = document.getElementById('feed');
    if (!more && disc?.code === code) return renderDisclosures();
    const offset = more ? disc.nextOffset : 0;
    const res = await fetch(`/api/disclosures?stockCode=${code}&offset=${offset}&limit=${more ? 10 : 2}&minor=${showMinor}`);
    if (selected?.stockCode !== code) return; // 받는 사이 다른 종목으로 이동
    if (!res.ok) {
      feed.replaceChildren(el('div', { className: 'empty', textContent: '공시를 불러오지 못했어요. (' + ((await res.json().catch(() => null))?.message ?? res.status) + ')' }));
      return;
    }
    const page = await res.json();
    disc = { code, items: [...(more ? disc.items : []), ...page.items], nextOffset: page.nextOffset };
    renderDisclosures();
  }
  function renderDisclosures() {
    const feed = document.getElementById('feed');
    const toggle = el('label', { className: 'minor-toggle' },
      el('input', { type: 'checkbox', checked: showMinor, onchange: e => { showMinor = e.target.checked; disc = null; loadDisclosures(false); } }),
      '사소한 공시도 보기 (임원 지분 보고, 증권 발행 서류 등)');
    const list = disc.items.length ? disc.items.map(feedItem)
      : [el('div', { className: 'empty', textContent: showMinor ? '최근 3개월 동안 나온 공시가 없어요.' : '최근 3개월 동안 눈여겨볼 공시가 없어요.' })];
    feed.replaceChildren(toggle, ...list,
      ...(disc.nextOffset != null ? [el('button', { className: 'more', textContent: '공시 더 보기', onclick: e => { e.target.disabled = true; loadDisclosures(true); } })] : []));
  }

  async function loadFeed() {
    if (selected?.stockCode && feedType === 'DISCLOSURE') {
      document.getElementById('feedTitle').textContent = '최근 3개월 공시';
      return loadDisclosures(false);
    }
    // 시장 뉴스는 종목과 상관없어서 종목·업종 화면에서도 홈과 같은 목록을 받는다
    const q = feedType === 'MARKET' ? '' : selected?.stockCode ? '?stockCode=' + encodeURIComponent(selected.stockCode)
      : selected?.industry ? '?industry=' + encodeURIComponent(selected.industry) : '';
    const items = (await (await fetch('/api/feed' + q)).json()).filter(i => feedType ? i.type === feedType : i.type !== 'MARKET'); // 시장 뉴스는 시장 탭에서만
    document.getElementById('feedTitle').textContent = selected?.stockCode ? '뉴스·공시' : selected ? selected.label + ' 뉴스·공시' : '전체 뉴스·공시';
    const feed = document.getElementById('feed');
    if (!items.length) {
      feed.replaceChildren(el('div', { className: 'empty', textContent: feedType ? '이 탭에 해당하는 항목이 없어요.' : '아직 모인 정보가 없습니다. 종목을 추가하거나 다음 수집(10분)을 기다려 주세요.' }));
      return;
    }
    feed.replaceChildren(...items.map(feedItem));
  }

  // 영어 기사: '번역'을 누르면 서버가 DeepL로 번역해 저장한다 (다음부터는 피드가 번역문을 준다)
  async function translateItem(i, node, button) {
    button.disabled = true;
    button.textContent = '번역 중…';
    const res = await fetch(`/api/news/${i.newsId}/translate`, { method: 'POST' });
    if (!res.ok) {
      button.textContent = '번역 실패: ' + ((await res.json().catch(() => null))?.message ?? res.status);
      return;
    }
    const t = await res.json();
    node.replaceWith(feedItem({ ...i, title: t.title, summary: t.summary, originalTitle: t.originalTitle }));
  }

  function feedItem(i) {
    const translate = i.newsId && !i.originalTitle
      ? el('button', { className: 'translate', textContent: '번역', onclick: e => translateItem(i, node, e.target) })
      : null;
    const node = el('div', {
        className: 'item ' + i.type,
        // 변동 항목을 누르면 그 종목 피드(관련 뉴스)로 이동
        onclick: i.type === 'MOVE' ? () => select({ stockCode: i.stockCode, label: i.stockName }) : null,
      },
      el('div', { className: 'meta' },
        el('span', { className: 'badge ' + i.type, textContent: LABEL[i.type] }),
        ...(i.importance === 'HIGH' ? [el('span', { className: 'badge HIGH', textContent: '중요' })] : []),
        el('span', { textContent: i.stockName }),
        el('span', { textContent: i.source ?? '' }),
        // DART는 접수 시각을 주지 않아 날짜만 (SEC는 초 단위 접수 시각이 있어 시각까지)
        el('span', { textContent: new Date(i.at).toLocaleString('ko-KR', i.source === 'DART' ? { month: 'numeric', day: 'numeric' } : { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) }),
        ...(translate ? [translate] : [])),
      i.url
        ? el('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer', textContent: i.title })
        : el('div', { className: 'title', textContent: i.title }),
      ...(i.originalTitle ? [el('p', { className: 'original', textContent: '원문: ' + i.originalTitle })] : []),
      el('p', { textContent: i.summary }),
      ...(i.tip ? [el('p', { className: 'tip', textContent: '볼 것: ' + i.tip })] : []));
    return node;
  }

  // 주소로 화면을 정한다 (#/, #/stock/005930, #/industry/이름). 새로고침·뒤로가기·링크 공유가 된다
  // 홈: 시장 전체 외국인 순매수. 위 칸은 누적과 그 4주(20영업일) 평균, 아래 칸은 하루치 (조원)
  // 누적선이 평균선을 뚫고 올라오면 외국인이 사는 쪽으로 돌아선 것으로 본다
  const FLOW_MARKETS = [['KOSPI', '코스피'], ['KOSDAQ', '코스닥']];
  let flowMarket = 'KOSPI', flowChart = null;
  const flowCache = new Map(); // 시장 → { at, flows: Promise } (홈에 돌아올 때마다 토스를 부르지 않게 10분)
  function getFlows(market) {
    let hit = flowCache.get(market);
    if (!hit || Date.now() - hit.at > 600_000) {
      hit = { at: Date.now(), flows: fetch('/api/market-flows?symbol=' + market).then(r => r.ok ? r.json() : []) };
      flowCache.set(market, hit);
      hit.flows.then(f => { if (!f.length) flowCache.delete(market); }); // 실패는 기억하지 않는다
    }
    return hit.flows;
  }
  async function loadFlows() {
    if (selected?.stockCode) return;
    document.getElementById('flowTabs').replaceChildren(...FLOW_MARKETS.map(([k, label]) =>
      el('button', { textContent: label, className: k === flowMarket ? 'active' : '', onclick: () => { flowMarket = k; loadFlows(); } })));
    renderFlows(await getFlows(flowMarket));
  }

  // 투자 관점 노트(views/*.json, git 제외: 실존 인물 영상 요약이라 공개 저장소에 안 올린다)를 지금 코스피에 대입한다
  // 노트가 없으면 섹션을 숨긴다. 그가 지금 이렇게 말한 게 아니라 그의 규칙을 지금 데이터에 맞춰 보여주는 것
  async function loadView() {
    const box = document.getElementById('viewBox');
    if (selected?.stockCode) return;
    const [note, bars, flows] = await Promise.all([
      fetch('/views/alsangmu.json').then(r => r.ok ? r.json() : null),
      fetchBars('KOSPI', '1d'), getFlows('KOSPI')]);
    box.hidden = !note || !bars || bars.length < 121 || flows.length < 21;
    if (!box.hidden) renderView(box, note, marketState(bars, flows));
  }

  // 코스피 일봉·외국인 누적으로 지금 상태를 고르고, 화면에 보여줄 숫자도 같이 만든다
  function marketState(bars, flows) {
    const c = closes(bars), i = c.length - 1, b = bars[i], prev = bars[i - 1];
    const [m20, m60, m120] = [20, 60, 120].map(n => sma(c, n));
    const lo = bollinger(c, 20, -1), up = bollinger(c, 20, 1);
    let sum = 0;
    const cum = flows.map(f => sum += f.foreigner), avg = sma(cum, 20), n = cum.length - 1;
    const since = test => { let d = 1; while (d < i && test(i - d) === test(i)) d++; return d; };
    const pct = (a, base) => (a / base - 1) * 100;
    const range = b.high - b.low;
    const st = {}, fact = {};
    st.flow = cum[n] > avg[n] ? 'above' : 'below';
    fact.flow = `외국인 누적 ${(cum[n] / 1e12).toFixed(0)}조, 4주 평균선 ${st.flow === 'above' ? '위' : '아래'} · 최근 5일 ${(flows.slice(-5).reduce((a, f) => a + f.foreigner, 0) / 1e12).toFixed(1)}조`;
    const under = [m20, m60, m120].filter(m => c[i] < m[i]).length;
    st.ma = under === 0 ? 'aboveAll' : under === 3 ? 'belowAll' : c[i] < m60[i] ? 'below60' : 'below20';
    fact.ma = `${fmt(c[i])} · 20일선 ${fmt(m20[i])}(${pct(c[i], m20[i]).toFixed(1)}%) · 60일선 ${fmt(m60[i])} · 120일선 ${fmt(m120[i])}`;
    st.cross = m20[i] > m60[i] ? 'golden' : 'dead';
    fact.cross = `${st.cross === 'golden' ? '20일선 > 60일선 (골든크로스)' : '20일선 < 60일선 (데드크로스)'} ${since(k => m20[k] > m60[k])}일째`;
    st.candle = c[i] - b.low <= range * 0.1 ? 'atLow' : b.high - c[i] <= range * 0.1 ? 'atHigh'
      : b.high <= prev.high && b.low >= prev.low ? 'inside' : 'normal';
    fact.candle = { atLow: '종가 = 저가', atHigh: '종가 = 고가', inside: '전날 봉 안에 갇힌 봉', normal: '보통 봉' }[st.candle]
      + ` (시가 ${fmt(b.open)} · 고가 ${fmt(b.high)} · 저가 ${fmt(b.low)} · 종가 ${fmt(c[i])})`;
    st.bb = c[i] < lo[i] && lo[i] < lo[i - 1] ? 'outsideLow' : c[i] > up[i] ? 'outsideHigh' : b.low <= lo[i] || c[i] < lo[i] ? 'touchLow' : 'inside';
    fact.bb = `하단 ${fmt(lo[i])} · 상단 ${fmt(up[i])} · 종가는 하단 대비 ${pct(c[i], lo[i]).toFixed(1)}%`;
    return { st, fact, price: c[i], date: new Date((b.time - KST) * 1000).toLocaleDateString('ko-KR') };
  }

  function renderView(box, note, m) {
    const cite = ref => {
      const [day, time] = ref.split(' ');
      const sec = time.split(':').reduce((a, v) => a * 60 + +v, 0);
      return el('a', { className: 'cite', href: `https://www.youtube.com/watch?v=${note.videos[day]}&t=${sec}s`, target: '_blank', rel: 'noopener',
        textContent: `▶ ${day.slice(0, 2)}/${day.slice(2)} ${time}` });
    };
    const levels = [...note.levels, { price: m.price, here: true }].sort((a, b) => b.price - a.price);
    box.replaceChildren(
      el('h2', { textContent: note.name + ' · 그의 판단 순서로 본 지금 코스피' }),
      el('div', { className: 'sub', textContent: `${note.source} · 영상 ${note.asOf}까지 · 지금 데이터 ${m.date} 종가` }),
      el('div', { className: 'summary', textContent: note.summary }),
      ...note.steps.map(step => {
        const s = step.states[m.st[step.key]];
        return el('div', { className: 'step' }, el('b', { textContent: step.title }), el('span', { className: 'now', textContent: m.fact[step.key] }),
          el('span', { className: 'read' }, '그라면 → ' + s.read, cite(s.cite)));
      }),
      el('div', { className: 'step' }, el('b', { textContent: '⑥ 그가 말한 레벨' }), el('div', { className: 'levels' }, ...levels.map(l => l.here
        ? el('div', { className: 'lv here' }, el('b', { textContent: fmt(l.price) }), el('span', { textContent: '← 지금' }))
        : el('div', { className: 'lv' }, el('b', { textContent: fmt(l.price) }), el('span', {}, l.text, cite(l.cite)))))),
      el('details', {}, el('summary', { textContent: '비중 규칙 · 경계할 것' }),
        el('ul', {}, ...note.rules.map(r => el('li', {}, r.text, cite(r.cite)))),
        el('ul', {}, ...note.warnings.map(r => el('li', {}, r.text, cite(r.cite))))),
      el('div', { className: 'track', textContent: note.track + ' · 그가 지금 이렇게 말한 게 아니라, 영상 속 규칙을 지금 데이터에 대입한 것이에요' }));
  }
  function renderFlows(flows) {
    flowChart?.remove();
    flowChart = null;
    const summary = document.getElementById('flowSummary');
    if (flows.length < 21) return summary.replaceChildren(el('div', { className: 'why', textContent: '수급 데이터를 받지 못했어요.' }));
    const jo = v => v / 1e12;
    let sum = 0;
    const cum = flows.map(f => sum += f.foreigner);
    const avg = sma(cum, 20);
    const above = i => cum[i] > avg[i];
    const n = flows.length - 1;
    let days = 1;
    while (days <= n && avg[n - days] != null && above(n - days) === above(n)) days++;
    const week = key => jo(flows.slice(-5).reduce((a, f) => a + f[key], 0));
    const signed = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '조';
    summary.replaceChildren(
      el('div', {}, el('b', { textContent: `누적선이 4주 평균선 ${above(n) ? '위' : '아래'} (${days}일째) ` }),
        el('span', { className: 'why', textContent: above(n) ? '· 외국인이 사는 쪽으로 돌아선 상태. 수급을 중시하는 투자자는 이때 비중을 늘린다'
          : '· 외국인이 아직 파는 흐름. 누적선이 평균선을 뚫고 올라오는지 지켜본다' })),
      el('div', { textContent: `최근 5일 순매수 · 외국인 ${signed(week('foreigner'))} · 기관 ${signed(week('institution'))} · 개인 ${signed(week('individual'))}` }),
      el('div', { className: 'why', textContent: `${flows[0].date}부터 ${flows.length}영업일 누적 (기준일에 따라 수치는 달라지니 선의 방향을 보세요) · 마지막 ${flows[n].date}, 당일은 잠정치` }));
    const chart = flowChart = LC.createChart(document.getElementById('flowChart'), {
      autoSize: true, layout: { fontSize: 11, panes: { separatorColor: '#e5e7eb' } },
      grid: { vertLines: { color: '#f1f3f5' }, horzLines: { color: '#f1f3f5' } },
      localization: { priceFormatter: v => v.toFixed(1) + '조' } });
    const line = chart.addSeries(LC.LineSeries, { color: '#111827', lineWidth: 2, priceLineVisible: false, title: '누적' });
    line.setData(flows.map((f, i) => ({ time: f.date, value: jo(cum[i]) })));
    chart.addSeries(LC.LineSeries, { color: DOWN, lineWidth: 1, lineStyle: LC.LineStyle.Dashed, priceLineVisible: false, lastValueVisible: false, title: '4주 평균' })
      .setData(flows.flatMap((f, i) => avg[i] == null ? [] : [{ time: f.date, value: jo(avg[i]) }]));
    chart.addSeries(LC.HistogramSeries, { priceLineVisible: false }, 1)
      .setData(flows.map(f => ({ time: f.date, value: jo(f.foreigner), color: f.foreigner >= 0 ? UP : DOWN })));
    chart.panes().forEach((p, i) => p.setStretchFactor(i === 0 ? 3 : 1));
    // 누적선이 평균선을 뚫은 날 표시
    LC.createSeriesMarkers(line, flows.flatMap((f, i) => i === 0 || avg[i - 1] == null || above(i) === above(i - 1) ? []
      : [{ time: f.date, position: above(i) ? 'belowBar' : 'aboveBar', shape: above(i) ? 'arrowUp' : 'arrowDown', color: above(i) ? UP : DOWN }]));
    chart.timeScale().fitContent();
  }

  function parseHash() {
    const [, kind, value] = location.hash.match(/^#\/(stock|industry)\/(.+)$/) ?? [];
    const v = value && decodeURIComponent(value);
    return kind === 'stock' ? { stockCode: v, label: v } : kind === 'industry' ? { industry: v, label: v } : null;
  }
  function select(target) {
    const hash = target?.stockCode ? '#/stock/' + encodeURIComponent(target.stockCode)
      : target?.industry ? '#/industry/' + encodeURIComponent(target.industry) : '#/';
    if (location.hash === hash) refresh(); else location.hash = hash; // 바뀌면 hashchange가 refresh
  }
  window.addEventListener('hashchange', () => { selected = parseHash(); window.scrollTo(0, 0); refresh(); });
  document.querySelector('h1').onclick = () => select(null);

  async function refresh() {
    // 종목을 골랐으면 종목 페이지, 아니면 홈. 차트를 만들기 전에 바꿔야 차트가 제 크기로 그려진다
    document.getElementById('main').classList.toggle('page-stock', !!selected?.stockCode);
    renderTabs(); // 시장 탭은 홈에서만 보인다
    await Promise.all([loadStocks(), loadFeed(), loadChart(), loadSide(), loadIndicators(), loadFlows(), loadView()]);
    renderHead();
    renderSide(); // 전일 종가가 늦게 와도 호가 등락률을 다시 계산
    document.getElementById('updated').textContent = new Date().toLocaleTimeString('ko-KR') + ' 갱신';
  }

  document.getElementById('follow').onsubmit = async ev => {
    ev.preventDefault();
    const form = ev.target;
    const button = form.querySelector('button');
    button.disabled = true; // 추가하면서 첫 뉴스까지 받아와 1~2초 걸린다
    const res = await fetch('/api/stocks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stockCode: form.stockCode.value.trim(), name: form.name.value.trim() })
    });
    button.disabled = false;
    document.getElementById('error').textContent = res.ok ? '' : ((await res.json()).message || '티커를 확인하세요');
    if (res.ok) { form.reset(); refresh(); }
  };

  // 토스 계좌에 들고 있는 종목을 관심종목에 한 번에 넣는다 (이미 있는 종목은 건너뜀)
  document.getElementById('importHoldings').onclick = async ev => {
    const button = ev.target;
    button.disabled = true;
    button.textContent = '가져오는 중…'; // 종목마다 첫 뉴스를 받아서 몇 초 걸린다
    const res = await fetch('/api/stocks/import-holdings', { method: 'POST' });
    const r = await res.json().catch(() => null);
    button.disabled = false;
    button.textContent = '토스 보유 종목 가져오기';
    document.getElementById('error').textContent = !res.ok ? '가져오지 못했어요: ' + (r?.message ?? res.status)
      : (r.added.length ? r.added.length + '개 추가: ' + r.added.join(', ') : '새로 추가할 보유 종목이 없어요')
        + (r.failed.length ? ' · 실패: ' + r.failed.join(', ') : '');
    refresh();
  };

  // 서버가 토스 실시간 체결을 SSE로 넘겨준다. 끊기면 EventSource가 알아서 다시 붙는다
  const stream = new EventSource('/api/stream');
  stream.onopen = () => document.getElementById('live').textContent = '● 실시간';
  stream.onerror = () => document.getElementById('live').textContent = '실시간 재연결 중…';
  stream.addEventListener('trade', ev => {
    const q = JSON.parse(ev.data);
    quotes.set(q.stockCode, q);
    if (q.stockCode === side.code) {
      side.trades = [{ price: q.lastPrice, volume: q.volume, timestamp: q.timestamp, currency: q.currency }, ...side.trades].slice(0, 50);
      scheduleSide();
    }
    document.querySelectorAll('.quote').forEach(old => {
      if (old.dataset.code !== q.stockCode) return;
      // 이미 그려진 칸은 글자만 바꾼다. 통째로 바꾸면 누르는 사이에 칸이 바뀌어 종목 클릭이 사라진다
      old.className = 'quote' + (q.bigMove ? ' big' : '');
      old.title = '전일 종가 ' + (q.prevClose ?? '-');
      old.children[0].textContent = priceText(q);
      old.children[1].className = 'rate ' + dirClass(q.changeRate);
      old.children[1].textContent = changeText(q);
    });
    onTradeChart(q);
  });
  stream.addEventListener('move', () => loadFeed());
  stream.addEventListener('orderbook', ev => {
    const { stockCode, book } = JSON.parse(ev.data);
    if (stockCode !== side.code) return; // 보고 있는 종목만 그린다
    side.book = book;
    scheduleSide();
  });

  selected = parseHash();
  renderTabs();
  refresh();
  setInterval(refresh, 60_000);
</script>
</body>
</html>
