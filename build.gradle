plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bongj9'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.h2database:h2' // 테스트는 메모리 DB로 빠르게
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 화면(frontend/, React)은 npm으로 빌드해서 static/에 넣는다. 소스가 그대로면 Gradle이 건너뛴다
tasks.register('npmInstall', Exec) {
	workingDir 'frontend'
	commandLine 'npm', 'ci'
	onlyIf { !file('frontend/node_modules').exists() }
}

tasks.register('buildFrontend', Exec) {
	dependsOn 'npmInstall'
	workingDir 'frontend'
	commandLine 'npm', 'run', 'build'
	inputs.dir('frontend/src')
	inputs.files('frontend/package.json', 'frontend/package-lock.json', 'frontend/index.html', 'frontend/vite.config.ts', 'frontend/tsconfig.json')
	outputs.dir('frontend/dist')
}

tasks.named('processResources', ProcessResources) {
	from(tasks.named('buildFrontend')) {
		into 'static'
	}
}
